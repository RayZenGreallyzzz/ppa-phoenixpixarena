name: Apply clan siege exit and collision cleanup
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-clan-siege-exit-collision-20260925.yml'
      - 'tools/apply-clan-siege-exit-collision-20260925.mjs'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply native siege exit/collision fix
        run: node tools/apply-clan-siege-exit-collision-20260925.mjs
      - name: Install dependencies
        run: npm install
      - name: Verify build
        run: npm run build
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/apply-clan-siege-exit-collision-20260925.mjs .github/workflows/apply-clan-siege-exit-collision-20260925.yml
          git add build.mjs
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "Fix clan siege exit placement and castle collision cleanup"
          git push
