name: Build Native PPA Godot APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "native-godot/**"
      - ".github/workflows/godot-native-android.yml"

jobs:
  build-godot-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.6"
      GODOT_STATUS: "stable"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android signing tools
        run: |
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Cache stable PPA debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/ppa-native-debug.keystore
          key: ppa-native-debug-keystore-v1

      - name: Ensure stable PPA debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/ppa-native-debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/ppa-native-debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Phoenix Pix Arena Debug,O=Phoenix,C=UA"
          fi

      - name: Download Godot 4.6 and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -L --fail --retry 3 -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          sudo ln -sf "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot

          curl -L --fail --retry 3 -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          godot --version

      - name: Configure Godot Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/timestamping_authority_url = ""
          export/android/shutdown_timestamping = true
          EOF
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.6.tres"

          sed -i 's|keystore/debug=""|keystore/debug="'"$HOME"'/.android/ppa-native-debug.keystore"|' native-godot/export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' native-godot/export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' native-godot/export_presets.cfg

      - name: Import native PPA project
        run: godot --headless --path native-godot --editor --import --quit

      - name: Build native PPA APK
        run: |
          mkdir -p build
          godot --headless --verbose --path native-godot --export-debug "Android" "$GITHUB_WORKSPACE/build/PhoenixPixArena-native-debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/PhoenixPixArena-native-debug.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose build/PhoenixPixArena-native-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoenixPixArena-native-debug
          path: build/PhoenixPixArena-native-debug.apk
          if-no-files-found: error
          retention-days: 90
