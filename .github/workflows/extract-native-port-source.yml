name: Extract native port source

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/extract-native-port-source.yml"
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack canonical PPA source
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const parts=Array.from({length:12},(_,i)=>`PPA${String(i+1).padStart(2,'0')}.bin`);
          const packed=Buffer.concat(parts.map(p=>fs.readFileSync(p)));
          const raw=zlib.gunzipSync(packed);
          fs.writeFileSync('native-port-source.html',raw);
          console.log('unpacked bytes',raw.length);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ppa-native-port-source
          path: native-port-source.html
          retention-days: 1
