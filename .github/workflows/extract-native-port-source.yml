name: Extract native port source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/extract-native-port-source.yml"

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack canonical PPA source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const names = ['PPA01.bin','PPA02.bin','PPA03.bin','PPA04.bin','PPA05.bin','PPA06.bin','PPA07.bin','PPA08.bin','PPA09.bin','PPA10.bin','PPA11.bin','PPA12.bin'];
          const parts = names.map(function(name) { return fs.readFileSync(name); });
          const packed = Buffer.concat(parts);
          const source = zlib.gunzipSync(packed);
          fs.writeFileSync('native-port-source.html', source);
          console.log('packed=' + packed.length + ' source=' + source.length);
          NODE
          test -s native-port-source.html
      - uses: actions/upload-artifact@v4
        with:
          name: ppa-native-port-source
          path: native-port-source.html
          retention-days: 1
