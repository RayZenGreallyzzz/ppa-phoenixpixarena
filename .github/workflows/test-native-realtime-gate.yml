name: Verify Godot shared realtime integration (safe)
on:
  pull_request:
    paths:
      - 'src/worker.js'
      - 'src/realtime.js'
      - 'src/native-npc-readonly.js'
      - 'tools/test-native-npc-readonly.mjs'
      - 'tools/test-native-realtime-ticket.mjs'
      - 'tools/test-native-character-identity.mjs'
      - '.github/workflows/test-native-realtime-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  realtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/worker.js
          node --check src/realtime.js
          node --check src/native-npc-readonly.js
          node --check tools/test-native-npc-readonly.mjs
          node --check tools/test-native-realtime-ticket.mjs
          node --check tools/test-native-character-identity.mjs
      - name: Native realtime uses the existing player identity and global hub
        run: |
          node tools/test-native-realtime-ticket.mjs
          node tools/test-native-character-identity.mjs
          node tools/test-native-npc-readonly.mjs
          node tools/test-godot-state-readonly.mjs
          node tools/test-godot-state-readonly-runtime.mjs
