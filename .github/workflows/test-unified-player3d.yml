name: Test unified Player3D
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Syntax checks
        run: |
          node --check gateway/player-3d-unified-runtime.js
          node --check gateway/remote-player-3d-dispatch.js
          node --check tools/player-source-cleanup-20261002.mjs
          node --check tools/postbuild-player-3d-unified-20261002.mjs
          node --check tools/postbuild-player3d-arena-stress-20261005.mjs
          node --check tools/postbuild-player3d-lowend-budget-20261005.mjs
          node --check tools/audit-player-render-ownership-20261003.mjs
      - name: Verify obsolete player render layers are absent
        run: |
          test ! -e gateway/remote-player-3d-adapter.js
          test ! -e gateway/remote-player-3d-runtime.js
          test ! -e gateway/remote-player-3d-runtime-v2.js
          test ! -e gateway/remote-sprite-renderer-3d-bridge.js
          test ! -e gateway/remote-sprite-renderer.js
          ! grep -q "postbuild-paladin-frame-cleanup-20260928.mjs\|postbuild-ai-training-sprite-metadata-cleanup-20261002.mjs\|postbuild-player-3d-local-lifecycle-20261003.mjs" package.json
      - name: Guard current unified source before build
        run: |
          grep -q "__PPA_PLAYER3D_UNIFIED_V2" gateway/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_RUNTIME_OWNS_LOCAL_STATE_20261003" gateway/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_STABLE_HUD_ANCHOR_20261003" gateway/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_ROOT_MOTION_LOCK_20261003" gateway/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_MELEE_CLIP_FILTER_20261003" gateway/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_ANIM_HOTLOOP_FIX_20261004" gateway/player-3d-unified-runtime.js
          grep -q "unified-v9-anim-speed-hotloop-fix" gateway/player-3d-unified-runtime.js
          grep -q "syncLocalFromGame(now);" gateway/player-3d-unified-runtime.js
          grep -q "threeInitPromise" gateway/player-3d-unified-runtime.js
          ! grep -q "animRateCheckAt\|lockMeleeAttackLowerBody\|captureMeleeLowerBody\|meleeLowerBody" gateway/player-3d-unified-runtime.js
          grep -q "__PPA_REMOTE_PLAYER3D_DISPATCH_V3" gateway/remote-player-3d-dispatch.js
          grep -q "PPA_3D_STRESS_CLASSES" gateway/remote-player-3d-dispatch.js
          grep -q "PPA_PLAYER3D_ARENA_STRESS_20261005" gateway/remote-player-3d-dispatch.js
          grep -q "PPA_PLAYER3D_REMOTE_SCRATCH_20261003" gateway/remote-player-3d-dispatch.js
          grep -q "__ppa3DVisualPosition" gateway/remote-player-3d-dispatch.js
          grep -q "__ppa3DAnchor" gateway/remote-player-3d-dispatch.js
          ! grep -q "r.x+=(r.tx-r.x)\|r.y+=(r.ty-r.y)" gateway/remote-player-3d-dispatch.js
          grep -q "PPA_PLAYER3D_ARENA_AI_STRESS_20261005" tools/postbuild-player3d-arena-stress-20261005.mjs
          grep -q "PPA_AI_TRAINING_PLAYER3D_20261005" tools/postbuild-player3d-arena-stress-20261005.mjs
          grep -q "PPA_PLAYER3D_LOWEND_BUDGET_20261005" tools/postbuild-player3d-lowend-budget-20261005.mjs
      - name: Build production client
        run: npm run build
      - name: Audit final player render ownership
        run: node tools/audit-player-render-ownership-20261003.mjs
      - name: Verify final arena AI, stress and low-end Player3D
        run: |
          grep -q "__PPA_PLAYER3D_UNIFIED_V2" public/game/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_ARENA_AI_STRESS_20261005" public/game/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_LOWEND_BUDGET_20261005" public/game/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_SHARED_MATERIALS_20261005" public/game/player-3d-unified-runtime.js
          grep -q "lowend-budget-v2" public/game/player-3d-unified-runtime.js
          grep -q "ppa3DMinFrameMs" public/game/player-3d-unified-runtime.js
          grep -q "PPA_HUD_TEXT_CACHE" public/game/player-3d-unified-runtime.js
          grep -q "ppaRemoteStaleMs" public/game/player-3d-unified-runtime.js
          ! grep -q "animRateCheckAt\|lockMeleeAttackLowerBody\|captureMeleeLowerBody\|meleeLowerBody" public/game/player-3d-unified-runtime.js
          grep -q "__PPA_REMOTE_PLAYER3D_DISPATCH_V3" public/game/remote-player-3d-dispatch.js
          grep -q "PPA_PLAYER3D_ARENA_STRESS_20261005" public/game/remote-player-3d-dispatch.js
          grep -q "player-3d-unified-runtime.js?v=20261005u21lowend2" public/index.html
          grep -q "remote-player-3d-dispatch.js?v=20261005arena3d2" public/index.html
          grep -q "PPA_PLAYER3D_LOCAL_ONLY_20261002" public/index.html
          grep -q "PPA_PLAYER3D_RUNTIME_OWNS_LOCAL_STATE_20261003" public/index.html
          grep -q "PPA_PLAYER3D_HUD_OWNS_LOCAL_LABELS_20261002" public/index.html
          grep -q "PPA_AI_TRAINING_PLAYER3D_20261005" public/index.html
          grep -q "PPA_AI_TRAINING_BODY_OWNED_BY_PLAYER3D_20261005" public/index.html
          grep -q "PPA_ONLINE_STRESS" public/index.html
          ! grep -Fq "cx.fillStyle='#9d63db';cx.beginPath();cx.arc(sx,sy-10,aiVisualSize*.35,0,Math.PI*2);cx.fill();" public/index.html
          ! grep -q "remote-sprite-renderer.js\|player-3d-runtime.js?v=\|remote-player-3d-runtime.js?v=" public/index.html
          test -e public/game/dungeon-mob-events.js
          test -e public/game/dungeon60-dragon.js
          test -e public/game/boss-drop-boost.js
          test -e public/game/clan-boss-loot.js
