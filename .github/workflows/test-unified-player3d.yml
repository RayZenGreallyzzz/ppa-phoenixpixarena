name: Test unified Player3D
on:
  push:
    branches:
      - player-3d-unified-v2-20261002
      - player-gameplay-anim-decouple-20261002
      - player-class-gameplay-decouple-20261002
      - remove-legacy-local-player-renderer-20261002
      - remove-legacy-local-player-hud-20261002
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --check gateway/player-3d-unified-runtime.js
      - run: node --check gateway/remote-player-3d-dispatch.js
      - run: node --check tools/postbuild-player-3d-unified-20261002.mjs
      - run: test ! -e gateway/remote-player-3d-adapter.js
      - run: test ! -e tools/postbuild-remote-player-3d-20261001.mjs
      - run: test ! -e gateway/remote-player-3d-runtime.js
      - run: test ! -e gateway/remote-player-3d-runtime-v2.js
      - run: test ! -e gateway/remote-sprite-renderer-3d-bridge.js
      - run: test ! -e gateway/remote-sprite-renderer.js
      - run: '! grep -q "v174AiSpriteCfg\|drawImage\|phoneCharacterBodySize" gateway/remote-player-3d-dispatch.js'
      - run: grep -q "worldX:Number(r.x),worldY:Number(r.y)" gateway/remote-player-3d-dispatch.js
      - run: grep -q "targetBody=Math.max(30,Number(r.sz)||30)" gateway/remote-player-3d-dispatch.js
      - run: grep -q "PPA_PLAYER3D_LOCAL_ONLY_20261002" tools/postbuild-player-3d-unified-20261002.mjs
      - run: grep -q "PPA_PLAYER3D_HUD_OWNS_LOCAL_LABELS_20261002" tools/postbuild-player-3d-unified-20261002.mjs
      - run: grep -q "const PLAYER_ANIM_TIMING=" tools/postbuild-player-3d-unified-20261002.mjs
      - name: Guard mob and boss systems before build
        run: |
          test -e gateway/dungeon-mob-events.js
          test -e gateway/dungeon60-dragon.js
          test -e gateway/boss-drop-boost.js
          test -e gateway/clan-boss-loot.js
      - run: npm run build
      - name: Verify Player3D exclusively owns local body and HUD
        run: |
          grep -q "__PPA_PLAYER3D_UNIFIED_V2" public/game/player-3d-unified-runtime.js
          grep -q "unified-v2-world" public/game/player-3d-unified-runtime.js
          grep -q "__PPA_REMOTE_PLAYER3D_DISPATCH_V1" public/game/remote-player-3d-dispatch.js
          ! grep -q "v174AiSpriteCfg\|drawImage\|phoneCharacterBodySize" public/game/remote-player-3d-dispatch.js
          grep -q "player-3d-unified-runtime.js?v=20261002u4" public/index.html
          grep -q "remote-player-3d-dispatch.js?v=20261002u5" public/index.html
          ! grep -q "remote-sprite-renderer.js" public/index.html
          ! grep -q "player-3d-runtime.js?v=" public/index.html
          ! grep -q "remote-player-3d-runtime.js?v=" public/index.html
          grep -q "PPA_PLAYER3D_LOCAL_ONLY_20261002" public/index.html
          grep -q "PPA_PLAYER3D_HUD_OWNS_LOCAL_LABELS_20261002" public/index.html
          grep -q "worldX:Number(P.x),worldY:Number(P.y)" public/index.html
          grep -q "const PLAYER_ANIM_TIMING=" public/index.html
          grep -q "function playerClassKey()" public/index.html
          grep -q "playerAnimTiming('attack')" public/index.html
          grep -q "if(playerIsClass('gnome')){ try{gnomeFireCannonball()}" public/index.html
          grep -q "else if(playerIsClass('archer')){ try{archerFireArrow()}" public/index.html
          ! grep -q "playerAnimDef(" public/index.html
          grep -q "function v174AiSpriteCfg(e){" public/index.html
          grep -Fq "GNOME_ANIM[a]" public/index.html
          grep -Fq "PALADIN_ANIM[a]" public/index.html
          test -e public/game/dungeon-mob-events.js
          test -e public/game/dungeon60-dragon.js
          test -e public/game/boss-drop-boost.js
          test -e public/game/clan-boss-loot.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('public/index.html','utf8');
          const dead=[
            'playerUsesGnomeSprites','playerUsesArcherSprites','playerUsesAssassinSprites','playerUsesTankSprites',
            'playerUsesBerserkerSprites','playerUsesPriestSprites','playerUsesMageSprites','playerUsesPaladinSprites',
            'playerUsesEightDirSprites','playerDir8','dir8Canonical','ppaPlayerNickname','ppaPlayerVisualTopScreenY',
            'ppaPlayerClanName','drawPlayerNickname'
          ];
          for(const name of dead)if(html.includes(name))throw new Error('dead local sprite/HUD symbol survived: '+name);
          const sig='function drawPlayer(){';
          const a=html.indexOf(sig);
          if(a<0)throw new Error('drawPlayer missing');
          const marker=html.indexOf('PPA_PLAYER3D_LOCAL_ONLY_20261002',a);
          if(marker<0||marker>a+1200)throw new Error('drawPlayer is not canonical 3D-only');
          const windowText=html.slice(a,a+1200);
          for(const bad of ['drawImage','playerUses','visualBody','phoneCharacter','cx.ellipse','PT.push'])if(windowText.includes(bad))throw new Error('legacy local renderer token near drawPlayer: '+bad);
          console.log('verified: Player3D dispatch is canonical; stress-bot path intact; mob/boss runtimes preserved');
          NODE
