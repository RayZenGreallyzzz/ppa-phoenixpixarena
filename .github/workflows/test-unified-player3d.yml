name: Test unified Player3D
on:
  push:
    branches:
      - main
      - player-3d-unified-v2-20261002
      - stage-5a2-recovery-audit-20261002
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --check gateway/player-3d-unified-runtime.js
      - run: node --check gateway/remote-player-3d-dispatch.js
      - run: node --check tools/player-source-cleanup-20261002.mjs
      - run: node --check tools/postbuild-player-3d-unified-20261002.mjs
      - run: node --check tools/audit-player-render-ownership-20261003.mjs
      - name: Verify obsolete player render and cleanup layers are absent
        run: |
          test ! -e gateway/remote-player-3d-adapter.js
          test ! -e tools/postbuild-remote-player-3d-20261001.mjs
          test ! -e gateway/remote-player-3d-runtime.js
          test ! -e gateway/remote-player-3d-runtime-v2.js
          test ! -e gateway/remote-sprite-renderer-3d-bridge.js
          test ! -e gateway/remote-sprite-renderer.js
          test ! -e tools/postbuild-paladin-frame-cleanup-20260928.mjs
          test ! -e tools/postbuild-ai-training-sprite-metadata-cleanup-20261002.mjs
          test ! -e tools/postbuild-player-3d-local-lifecycle-20261003.mjs
          ! grep -q "postbuild-paladin-frame-cleanup-20260928.mjs\|postbuild-ai-training-sprite-metadata-cleanup-20261002.mjs\|postbuild-player-3d-local-lifecycle-20261003.mjs" package.json
      - name: Guard Player3D and mob boss source systems before build
        run: |
          grep -q "__ppa3DX" gateway/remote-player-3d-dispatch.js
          grep -q "__ppa3DY" gateway/remote-player-3d-dispatch.js
          grep -q "__ppa3DLastAt" gateway/remote-player-3d-dispatch.js
          grep -q "PPA_PLAYER3D_REMOTE_SCRATCH_20261003" gateway/remote-player-3d-dispatch.js
          grep -q "__ppa3DVisualPosition" gateway/remote-player-3d-dispatch.js
          grep -q "__ppa3DAnchor" gateway/remote-player-3d-dispatch.js
          ! grep -q "r.x+=(r.tx-r.x)" gateway/remote-player-3d-dispatch.js
          ! grep -q "r.y+=(r.ty-r.y)" gateway/remote-player-3d-dispatch.js
          ! grep -q "r.lastDrawAt=now" gateway/remote-player-3d-dispatch.js
          grep -q "targetBody=Math.max(30,Number(r.sz)||30)" gateway/remote-player-3d-dispatch.js
          ! grep -q "v174AiSpriteCfg\|drawImage\|phoneCharacterBodySize" gateway/remote-player-3d-dispatch.js
          grep -q "PPA_PLAYER3D_LOCAL_ONLY_20261002" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "PPA_PLAYER3D_RUNTIME_OWNS_LOCAL_STATE_20261003" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "PPA_PLAYER3D_HUD_OWNS_LOCAL_LABELS_20261002" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "const PLAYER_ANIM_TIMING=" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "PPA_AI_TRAINING_SPRITE_SOURCE_CLEANUP_20261002" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "PPA_PLAYER3D_RUNTIME_OWNS_LOCAL_STATE_20261003" gateway/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_VIEWPORT_CACHE_20261003" gateway/player-3d-unified-runtime.js
          grep -q "function prepareGroundBasis(view){" gateway/player-3d-unified-runtime.js
          grep -q "localSceneToken" gateway/player-3d-unified-runtime.js
          grep -q "syncLocalFromGame(now);" gateway/player-3d-unified-runtime.js
          grep -q "threeInitPromise" gateway/player-3d-unified-runtime.js
          ! grep -q "e.kind==='local'?500:1800" gateway/player-3d-unified-runtime.js
          ! grep -q "__PPA3D_LOCAL_PENDING" gateway/player-3d-unified-runtime.js
          test -e gateway/dungeon-mob-events.js
          test -e gateway/dungeon60-dragon.js
          test -e gateway/boss-drop-boost.js
          test -e gateway/clan-boss-loot.js
      - run: npm run build
      - name: Audit final player render ownership
        run: node tools/audit-player-render-ownership-20261003.mjs
      - name: Verify unified Player3D and protected gameplay systems after build
        run: |
          grep -q "__PPA_PLAYER3D_UNIFIED_V2" public/game/player-3d-unified-runtime.js
          grep -q "unified-v4-state-isolated" public/game/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_RUNTIME_OWNS_LOCAL_STATE_20261003" public/game/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_VIEWPORT_CACHE_20261003" public/game/player-3d-unified-runtime.js
          grep -q "function prepareGroundBasis(view){" public/game/player-3d-unified-runtime.js
          grep -q "localSceneToken" public/game/player-3d-unified-runtime.js
          grep -q "syncLocalFromGame(now);" public/game/player-3d-unified-runtime.js
          grep -q "threeInitPromise" public/game/player-3d-unified-runtime.js
          ! grep -q "e.kind==='local'?500:1800" public/game/player-3d-unified-runtime.js
          ! grep -q "__PPA3D_LOCAL_PENDING" public/game/player-3d-unified-runtime.js
          grep -q "__PPA_REMOTE_PLAYER3D_DISPATCH_V2" public/game/remote-player-3d-dispatch.js
          grep -q "PPA_PLAYER3D_REMOTE_SCRATCH_20261003" public/game/remote-player-3d-dispatch.js
          grep -q "__ppa3DX" public/game/remote-player-3d-dispatch.js
          grep -q "__ppa3DVisualPosition" public/game/remote-player-3d-dispatch.js
          grep -q "__ppa3DAnchor" public/game/remote-player-3d-dispatch.js
          ! grep -q "r.x+=(r.tx-r.x)" public/game/remote-player-3d-dispatch.js
          grep -q "player-3d-unified-runtime.js?v=20261003u11" public/index.html
          grep -q "remote-player-3d-dispatch.js?v=20261003u7" public/index.html
          grep -q "PPA_PLAYER3D_LOCAL_ONLY_20261002" public/index.html
          grep -q "PPA_PLAYER3D_RUNTIME_OWNS_LOCAL_STATE_20261003" public/index.html
          grep -q "PPA_PLAYER3D_HUD_OWNS_LOCAL_LABELS_20261002" public/index.html
          ! grep -q "__PPA3D_LOCAL_PENDING" public/index.html
          grep -q "const PLAYER_ANIM_TIMING=" public/index.html
          grep -q "function playerClassKey()" public/index.html
          grep -q "playerAnimTiming('attack')" public/index.html
          grep -q "const V174_AI_CLASS=" public/index.html
          grep -q "function v174SpawnAiTrainingFighter" public/index.html
          grep -q "PPA_AI_TRAINING_ACTIVE" public/index.html
          grep -q "function v174DrawAiTrainingFighter(e,sx,sy){" public/index.html
          grep -q "isAiFighter:true" public/index.html
          grep -q "PPA_ONLINE_STRESS" public/index.html
          grep -Fq "cx.fillStyle='#9d63db';cx.beginPath();cx.arc(sx,sy-10,aiVisualSize*.35,0,Math.PI*2);cx.fill();" public/index.html
          ! grep -q "remote-sprite-renderer.js\|player-3d-runtime.js?v=\|remote-player-3d-runtime.js?v=" public/index.html
          ! grep -q "playerAnimDef(\|function v174AiSpriteCfg(e){\|function v174AiDirIndex(e){" public/index.html
          for sym in GNOME_ANIM ARCHER_ANIM ASSASSIN_ANIM TANK_ANIM BERSERKER_ANIM PRIEST_ANIM MAGE_ANIM PALADIN_ANIM; do ! grep -q "$sym" public/index.html; done
          test -e public/game/dungeon-mob-events.js
          test -e public/game/dungeon60-dragon.js
          test -e public/game/boss-drop-boost.js
          test -e public/game/clan-boss-loot.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('public/index.html','utf8');
          const sig='function drawPlayer(){';
          const a=html.indexOf(sig);
          if(a<0)throw new Error('drawPlayer missing');
          const body=html.slice(a,a+1200);
          if(!body.includes('PPA_PLAYER3D_LOCAL_ONLY_20261002'))throw new Error('drawPlayer is not Player3D-only');
          if(!body.includes('PPA_PLAYER3D_RUNTIME_OWNS_LOCAL_STATE_20261003'))throw new Error('drawPlayer compatibility hook lacks runtime ownership marker');
          for(const bad of ['drawImage','playerUses','visualBody','phoneCharacter','cx.ellipse','PT.push','__PPA3D_LOCAL_PENDING','worldX','worldY','PPA_PLAYER3D.local'])if(body.includes(bad))throw new Error('legacy/local lifecycle token near drawPlayer: '+bad);
          console.log('verified: unified Player3D owns real player visuals; optimized render state is isolated; AI and mob/boss systems preserved');
          NODE