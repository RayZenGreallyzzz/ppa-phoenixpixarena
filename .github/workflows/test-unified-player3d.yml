name: Test unified Player3D
on:
  push:
    branches:
      - player-3d-unified-v2-20261002
      - player-gameplay-anim-decouple-20261002
      - player-class-gameplay-decouple-20261002
      - remove-legacy-local-player-renderer-20261002
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --check gateway/player-3d-unified-runtime.js
      - run: node --check gateway/remote-sprite-renderer.js
      - run: node --check tools/postbuild-player-3d-unified-20261002.mjs
      - run: test ! -e gateway/remote-player-3d-adapter.js
      - run: test ! -e tools/postbuild-remote-player-3d-20261001.mjs
      - run: test ! -e gateway/remote-player-3d-runtime.js
      - run: test ! -e gateway/remote-player-3d-runtime-v2.js
      - run: test ! -e gateway/remote-sprite-renderer-3d-bridge.js
      - run: '! grep -q "v174AiSpriteCfg\|drawImage\|phoneCharacterBodySize" gateway/remote-sprite-renderer.js'
      - run: grep -q "worldX:Number(r.x),worldY:Number(r.y)" gateway/remote-sprite-renderer.js
      - run: grep -q "targetBody=Math.max(30,Number(r.sz)||30)" gateway/remote-sprite-renderer.js
      - run: grep -q "PPA_PLAYER3D_LOCAL_ONLY_20261002" tools/postbuild-player-3d-unified-20261002.mjs
      - run: grep -q "const PLAYER_ANIM_TIMING=" tools/postbuild-player-3d-unified-20261002.mjs
      - run: npm run build
      - name: Verify Player3D exclusively owns the local real-player body
        run: |
          grep -q "__PPA_PLAYER3D_UNIFIED_V2" public/game/player-3d-unified-runtime.js
          grep -q "unified-v2-world" public/game/player-3d-unified-runtime.js
          grep -q "__PPA_REMOTE3D_ADAPTER_V2" public/game/remote-sprite-renderer.js
          ! grep -q "v174AiSpriteCfg\|drawImage\|phoneCharacterBodySize" public/game/remote-sprite-renderer.js
          grep -q "player-3d-unified-runtime.js?v=20261002u4" public/index.html
          grep -q "remote-sprite-renderer.js?v=20261002u4" public/index.html
          ! grep -q "player-3d-runtime.js?v=" public/index.html
          ! grep -q "remote-player-3d-runtime.js?v=" public/index.html
          grep -q "PPA_PLAYER3D_LOCAL_ONLY_20261002" public/index.html
          grep -q "worldX:Number(P.x),worldY:Number(P.y)" public/index.html
          grep -q "const PLAYER_ANIM_TIMING=" public/index.html
          grep -q "function playerClassKey()" public/index.html
          grep -q "playerAnimTiming('attack')" public/index.html
          grep -q "if(playerIsClass('gnome')){ try{gnomeFireCannonball()}" public/index.html
          grep -q "else if(playerIsClass('archer')){ try{archerFireArrow()}" public/index.html
          ! grep -q "playerAnimDef(" public/index.html
          ! grep -q "if(playerUsesGnomeSprites()){ try{gnomeFireCannonball()}" public/index.html
          ! grep -q "else if(playerUsesArcherSprites()){ try{archerFireArrow()}" public/index.html
          ! grep -q "movingNow && P.attackMode!='melee' && !playerUsesArcherSprites()" public/index.html
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('public/index.html','utf8');
          const sig='function drawPlayer(){';
          const a=html.indexOf(sig);
          if(a<0)throw new Error('drawPlayer missing');
          const marker=html.indexOf('PPA_PLAYER3D_LOCAL_ONLY_20261002',a);
          if(marker<0||marker>a+1200)throw new Error('drawPlayer is not canonical 3D-only');
          const windowText=html.slice(a,a+1200);
          for(const bad of ['drawImage','playerUses','visualBody','phoneCharacter','cx.ellipse','PT.push']){
            if(windowText.includes(bad))throw new Error('legacy local renderer token near drawPlayer: '+bad);
          }
          console.log('verified: legacy local Canvas player renderer and playerAnimDef are absent');
          NODE
