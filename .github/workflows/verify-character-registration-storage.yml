name: Verify character registration and newbie storage

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, 'Run character registration storage verify')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - name: Verify generated registration gate and newbie runtime
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('public/index.html','utf8');
          const n=fs.readFileSync('public/game/newbie-chest-runtime.js','utf8');
          if(!h.includes("PPA.ppaRegisterCharacter(_nick,_ppaClassKey)")) throw new Error('registration-before-beginGame patch missing');
          if(!h.includes("PPA_OPEN_NEWBIE_CHEST")) throw new Error('newbie chest UI integration missing');
          if(!n.includes("INV.storage.personal")) throw new Error('personal storage newbie chest runtime missing');
          if(!n.includes("locateChest")) throw new Error('newbie chest location resolver missing');
          NODE
      - name: Parse Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/ppa-worker-dry
