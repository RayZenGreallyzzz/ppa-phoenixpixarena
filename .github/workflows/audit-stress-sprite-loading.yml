name: Audit stress sprite loading
on:
  push:
    branches:
      - stress-sprites-lazy-20261002
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: node tools/audit-stress-sprite-loading-20261002.mjs
