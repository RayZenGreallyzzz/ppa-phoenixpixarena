name: Verify newbie chest

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, 'Run newbie chest build verify')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - name: Verify outputs
        run: |
          test -f public/assets/newbie-chest-gray.webp
          test -f public/game/newbie-chest-runtime.js
          grep -q "PPA_OPEN_NEWBIE_CHEST" public/index.html
