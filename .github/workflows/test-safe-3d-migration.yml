name: Test safe 3D migration
on:
  push:
    branches:
      - safe-3d-decouple-20261001
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --check gateway/remote-player-3d-runtime-v2.js
      - run: node --check gateway/remote-sprite-renderer-3d-bridge.js
      - run: node --check tools/postbuild-player-3d-decouple-20261001.mjs
      - run: node --check tools/postbuild-remote-player-3d-20261001.mjs
      - run: npm run build
      - name: Verify built remote 3D V2 routing
        run: |
          grep -q "__PPA_REMOTE_CLASS_SPRITES_V281" public/game/remote-sprite-renderer.js
          grep -q "V2-claim" public/game/remote-player-3d-runtime.js
          grep -q "remote-player-3d-runtime.js?v=20261002b" public/index.html
          grep -q "remote-sprite-renderer.js?v=20261002b" public/index.html
