name: Extract class select flow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    if: contains(github.event.head_commit.message, 'Run class select flow diagnostic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/extract-class-select-flow.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-class-select-flow.txt
          git commit -m "Add class select flow diagnostic"
          git push
