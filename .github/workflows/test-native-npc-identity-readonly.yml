name: PPA native NPC signed-owner read-only QA
on:
  pull_request:
    paths:
      - 'src/worker.js'
      - 'src/native-npc-readonly.js'
      - 'tools/test-native-npc-readonly.mjs'
      - 'tools/test-native-npc-rollout-matrix.mjs'
      - 'docs/ppa-godot-npc-readonly-rollout.md'
      - '.github/workflows/test-native-npc-identity-readonly.yml'
permissions:
  contents: read
jobs:
  read-only-npc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed owner, feature gates, no D1 writes
        run: node tools/test-native-npc-readonly.mjs
      - name: Rehearse two-owner NPC rollout and blocked economy actions
        run: node tools/test-native-npc-rollout-matrix.mjs
