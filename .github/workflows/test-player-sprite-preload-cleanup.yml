name: Test player sprite cleanup
on:
  push:
    branches:
      - player-sprite-code-cleanup-20261002
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --check tools/postbuild-player-sprite-preload-cleanup-20261002.mjs
      - run: node --check tools/postbuild-ai-training-sprite-metadata-cleanup-20261002.mjs
      - name: Verify obsolete mobile sprite wrapper is removed
        run: |
          test ! -e gateway/mobile-sprite-performance.js
      - run: npm run build
      - name: Verify legacy player sprite runtime paths are gone while AI Training stays alive
        run: |
          grep -q "PPA_PLAYER_SPRITE_PRELOAD_DISABLED_20261002" public/index.html
          grep -q "player-3d-unified-runtime.js" public/index.html
          ! grep -q "mobile-sprite-performance.js" public/index.html
          test ! -e public/game/mobile-sprite-performance.js
          ! grep -q "function v174AiSpriteCfg(e){" public/index.html
          ! grep -q "function v174AiDirIndex(e){" public/index.html
          grep -q "const V174_AI_CLASS=" public/index.html
          grep -q "function v174SpawnAiTrainingFighter" public/index.html
          grep -q "PPA_AI_TRAINING_ACTIVE" public/index.html
          grep -q "function v174DrawAiTrainingFighter(e,sx,sy){" public/index.html
          grep -q "isAiFighter:true" public/index.html
          grep -q "PPA_ONLINE_STRESS" public/index.html
          grep -q "const PLAYER_ANIM_TIMING=" public/index.html
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('public/index.html','utf8');
          const start=html.indexOf('const RESOURCES=[');
          const end=html.indexOf('\n];',start);
          if(start<0||end<0)throw new Error('RESOURCES block missing');
          const block=html.slice(start,end);
          const vars=['imgIdle','imgRun','imgAtk','imgGnomeIdle','imgGnomeRun','imgGnomeAttack','imgArcherIdle','imgArcherRun','imgArcherAttack','imgAssassinIdle','imgAssassinRun','imgAssassinAttack','imgTankIdle','imgTankRun','imgTankAttack','imgBerserkerIdle','imgBerserkerRun','imgBerserkerAttack','imgPriestIdle','imgPriestRun','imgPriestAttack','imgMageIdle','imgMageRun','imgMageAttack','imgPaladinIdle','imgPaladinRun','imgPaladinAttack'];
          for(const v of vars)if(new RegExp('img:'+v+'(?:,|\\})').test(block))throw new Error('legacy player preload survived: '+v);
          if(!block.includes("name:'Safe Zone Map'"))throw new Error('Safe Zone resource missing');
          if(!block.includes("name:'Arena Map'"))throw new Error('Arena resource missing');
          const dead=['GNOME_ANIM','ARCHER_ANIM','ASSASSIN_ANIM','TANK_ANIM','BERSERKER_ANIM','PRIEST_ANIM','MAGE_ANIM','PALADIN_ANIM','v174AiSpriteCfg','v174AiDirIndex'];
          for(const name of dead)if(html.includes(name))throw new Error('dead AI/player sprite metadata survived: '+name);
          console.log('verified: real-player sprite paths removed; AI Training kept on primitive visual; online stress kept');
          NODE
