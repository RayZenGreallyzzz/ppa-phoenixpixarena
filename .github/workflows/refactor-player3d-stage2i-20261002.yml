name: Refactor Player3D Stage 2I
on:
  push:
    branches:
      - player3d-stage2i-20261002
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply clean source refactor once
        run: |
          if [ -e gateway/remote-player-3d-dispatch.js ]; then
            echo "Stage 2I source refactor already applied"
            exit 0
          fi
          node tools/refactor-player3d-stage2i-20261002.mjs
          git config user.name "RayZenGreallyzzz"
          git config user.email "genry.undeniable@gmail.com"
          git add -A
          git commit -m "Refactor remaining player renderer naming"
          git push origin HEAD:player3d-stage2i-20261002
