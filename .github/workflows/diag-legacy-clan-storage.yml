name: Diagnose original clan warehouse mutation (no deployment)
on:
  pull_request:
    paths:
      - 'tools/diag-legacy-clan-storage.mjs'
      - '.github/workflows/diag-legacy-clan-storage.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node tools/diag-legacy-clan-storage.mjs
