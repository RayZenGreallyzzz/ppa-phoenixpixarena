name: Patch Player3D idle yaw temp
on:
  push:
    branches:
      - fix-player3d-idle-yaw-20261002
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Player3D idle yaw fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/patch-player3d-idle-yaw-temp.mjs
      - run: node --check gateway/player-3d-unified-runtime.js
      - name: Verify yaw invariants
        run: |
          grep -F "if(e.hasMotionYaw&&!attack)return e.lastMotionYaw;" gateway/player-3d-unified-runtime.js
          grep -F "if(e.hasMotionYaw&&!remoteAttack)return e.lastMotionYaw;" gateway/player-3d-unified-runtime.js
          grep -F "return now<e.movingUntil?'run':'idle';" gateway/player-3d-unified-runtime.js
      - name: Commit runtime only
        run: |
          git config user.name "PPA CI"
          git config user.email "actions@users.noreply.github.com"
          git add gateway/player-3d-unified-runtime.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply Player3D idle yaw fix"
          git push origin HEAD:fix-player3d-idle-yaw-20261002
