name: Apply clan boss audit sync 20261002
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Apply clan boss audit sync')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch stale clan boss audit
        run: node tools/fix-clan-boss-audit-20261002.mjs
      - name: Syntax check
        run: node --check build.mjs
      - name: Preserve intended build audit edit
        run: cp build.mjs /tmp/build.mjs
      - name: Install dependencies without lockfile
        run: npm install --no-audit --no-fund --ignore-scripts --package-lock=false
      - name: Full production build verification
        run: npm run build
      - name: Restore clean tree with only verified audit edit
        run: |
          git reset --hard HEAD
          cp /tmp/build.mjs build.mjs
      - name: Save verified fix and remove diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.mjs
          git rm --ignore-unmatch tools/fix-clan-boss-audit-20261002.mjs tools/diagnose-clan-boss-audit-20261002.mjs .github/workflows/verify-current-build-20261002.yml
          git commit -m "Sync clan boss build audit with current runtime"
          git push
