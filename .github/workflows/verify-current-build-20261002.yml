name: Diagnose clan boss audit 20261002
on:
  push:
    branches:
      - main
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, 'Run clan boss audit diagnostic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/diagnose-clan-boss-audit-20261002.mjs
