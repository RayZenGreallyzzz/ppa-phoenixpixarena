name: Extract newbie kit source
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  extract:
    if: contains(github.event.head_commit.message, 'Run newbie kit source extraction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/extract-newbie-kit-source-20260928.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-newbie-kit-source.txt
          git commit -m "Add newbie kit source diagnostics"
          git push
