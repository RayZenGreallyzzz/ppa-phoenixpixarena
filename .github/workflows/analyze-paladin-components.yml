name: Analyze paladin frame components
on:
  push:
    branches: [diag-player-number-20260928]
permissions:
  contents: write
jobs:
  analyze:
    if: contains(github.event.head_commit.message, 'Run paladin component audit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/analyze-paladin-components.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-paladin-components.json
          git commit -m "Add paladin component audit"
          git push
