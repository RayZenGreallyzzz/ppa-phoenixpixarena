name: Audit remaining player legacy visuals
on:
  push:
    branches:
      - player-legacy-visual-audit-20261002
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: node tools/audit-player-legacy-visuals-20261002.mjs
