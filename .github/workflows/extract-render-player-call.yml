name: Extract render player call
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    if: contains(github.event.head_commit.message, 'Run render player call diagnostic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/extract-render-player-call.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-render-player-call.txt
          git commit -m "Add render player call diagnostic"
          git push
