name: Finalize Player3D melee in-place
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-player3d-melee-inplace-20261003.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Align permanent Player3D CI guards
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=[
            '.github/workflows/test-player3d-performance.yml',
            '.github/workflows/test-unified-player3d.yml',
            '.github/workflows/test-player-source-cleanup.yml'
          ];
          for(const f of files){
            let s=fs.readFileSync(f,'utf8');
            s=s.replaceAll('unified-v5-rootmotion-locked','unified-v6-melee-inplace');
            s=s.replaceAll('player-3d-unified-runtime.js?v=20261003u15','player-3d-unified-runtime.js?v=20261003u16');
            fs.writeFileSync(f,s);
          }
          const perf='.github/workflows/test-player3d-performance.yml';
          let s=fs.readFileSync(perf,'utf8');
          const sourceNeedle='          grep -q "PPA_PLAYER3D_ROOT_MOTION_LOCK_20261003" gateway/player-3d-unified-runtime.js\n';
          const sourceAdd=sourceNeedle+
            '          grep -q "PPA_PLAYER3D_MELEE_INPLACE_ATTACK_20261003" gateway/player-3d-unified-runtime.js\n'+
            '          grep -Fq "MELEE_INPLACE_CLASSES=new Set([\'tank\',\'barbarian\',\'paladin\',\'assassin\'])" gateway/player-3d-unified-runtime.js\n'+
            '          grep -q "lockMeleeAttackLowerBody(e);" gateway/player-3d-unified-runtime.js\n';
          if(!s.includes('PPA_PLAYER3D_MELEE_INPLACE_ATTACK_20261003')){
            if(!s.includes(sourceNeedle))throw new Error('performance source guard anchor missing');
            s=s.replace(sourceNeedle,sourceAdd);
          }
          const builtNeedle='          grep -q "PPA_PLAYER3D_ROOT_MOTION_LOCK_20261003" public/game/player-3d-unified-runtime.js\n';
          const builtAdd=builtNeedle+
            '          grep -q "PPA_PLAYER3D_MELEE_INPLACE_ATTACK_20261003" public/game/player-3d-unified-runtime.js\n'+
            '          grep -Fq "MELEE_INPLACE_CLASSES=new Set([\'tank\',\'barbarian\',\'paladin\',\'assassin\'])" public/game/player-3d-unified-runtime.js\n'+
            '          grep -q "lockMeleeAttackLowerBody(e);" public/game/player-3d-unified-runtime.js\n';
          if((s.match(/PPA_PLAYER3D_MELEE_INPLACE_ATTACK_20261003/g)||[]).length<2){
            if(!s.includes(builtNeedle))throw new Error('performance built guard anchor missing');
            s=s.replace(builtNeedle,builtAdd);
          }
          fs.writeFileSync(perf,s);
          NODE
      - run: npm install
      - name: Verify canonical runtime before cleanup
        run: |
          node --check gateway/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_MELEE_INPLACE_ATTACK_20261003" gateway/player-3d-unified-runtime.js
          grep -Fq "MELEE_INPLACE_CLASSES=new Set(['tank','barbarian','paladin','assassin'])" gateway/player-3d-unified-runtime.js
          grep -q "lockMeleeAttackLowerBody(e);" gateway/player-3d-unified-runtime.js
          grep -q "unified-v6-melee-inplace" gateway/player-3d-unified-runtime.js
          grep -q "player-3d-unified-runtime.js?v=20261003u16" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "v634-player3d-melee-inplace-20261003" build.mjs
      - name: Production build and ownership audit
        run: |
          npm run build
          node tools/audit-player-render-ownership-20261003.mjs
          grep -q "PPA_PLAYER3D_MELEE_INPLACE_ATTACK_20261003" public/game/player-3d-unified-runtime.js
          grep -q "unified-v6-melee-inplace" public/game/player-3d-unified-runtime.js
          grep -q "player-3d-unified-runtime.js?v=20261003u16" public/index.html
      - name: Remove one-shot migration and commit permanent guards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/migrate-player3d-melee-inplace-20261003.mjs
          git rm -f .github/workflows/migrate-player3d-melee-inplace-20261003.yml
          git rm -f .github/workflows/finalize-player3d-melee-inplace-20261003.yml
          git add .github/workflows/test-player3d-performance.yml .github/workflows/test-unified-player3d.yml .github/workflows/test-player-source-cleanup.yml
          git commit -m "Protect in-place melee Player3D behavior"
          git push
