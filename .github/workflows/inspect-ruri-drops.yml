name: Inspect Ruri Drops

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-ruri-drops.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect material loot helpers
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const parts=Array.from({length:12},(_,i)=>`PPA${String(i+1).padStart(2,'0')}.bin`);
          const src=zlib.gunzipSync(Buffer.concat(parts.map(p=>fs.readFileSync(p)))).toString('utf8');
          const terms=['function pushMaterialDrop','kind:\'material\'','kind:"material"','kind:\'mat\'','kind:"mat"','INV.materials[','materials[name]','function pickupLoot','function collectLoot'];
          for(const term of terms){
            let p=0,n=0;
            while((p=src.indexOf(term,p))>=0&&n<10){
              let s=src.slice(Math.max(0,p-3500),Math.min(src.length,p+9000));
              s=s.replace(/data:image\/[A-Za-z0-9.+-]+;base64,[A-Za-z0-9+/=]+/g,'data:image/REMOVED;base64,REMOVED');
              console.log('\n===== '+term+' @ '+p+' =====\n'+s);
              p+=term.length;n++;
            }
          }
          NODE
