name: Inspect Ruri Drops

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-ruri-drops.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fast scan Ruri resource stems
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const parts=Array.from({length:12},(_,i)=>`PPA${String(i+1).padStart(2,'0')}.bin`);
          const src=zlib.gunzipSync(Buffer.concat(parts.map(p=>fs.readFileSync(p)))).toString('utf8');
          const low=src.toLowerCase();
          const terms=['кристалл','оскол','кров','демон','blood','demon','crystal','shard','ruri','рури'];
          const hits=[];
          for(const term of terms){
            let p=0,n=0;
            while((p=low.indexOf(term,p))>=0&&n<60){
              hits.push({term,p,ctx:src.slice(Math.max(0,p-1800),Math.min(src.length,p+3600))});
              p+=term.length;n++;
            }
          }
          console.log('HIT_COUNT='+hits.length);
          for(const h of hits)console.log('\n===== '+h.term+' @ '+h.p+' =====\n'+h.ctx);
          NODE
