name: Verify Ruri Drop Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-ruri-drops.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - name: Verify Ruri event drop wiring
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('public/index.html','utf8');
          const boss=h.indexOf('/game/boss-drop-boost.js');
          const ruri=h.indexOf('/game/ruri-event-drops.js');
          const checks=[
            ['ruri runtime published',fs.existsSync('public/game/ruri-event-drops.js')],
            ['runtime loaded',ruri>=0],
            ['loaded after boss boost',boss>=0&&ruri>boss],
            ['test build',h.includes('v528-ruri-event-drop-test-active-20260923')]
          ];
          const js=fs.readFileSync('public/game/ruri-event-drops.js','utf8');
          checks.push(
            ['demonic 0.05',js.includes("chance:0.0005")],
            ['elite 0.8',js.includes("chance:0.008")],
            ['boss20 1.5',js.includes("chance:0.015")],
            ['boss40 2.5',js.includes("chance:0.025")],
            ['boss60 4',js.includes("chance:0.04")],
            ['world boss 8',js.includes("chance:0.08")],
            ['test active',js.includes("var TEST_ACTIVE=true")],
            ['drop info wrapped',js.includes("mobDropInfo.__ppaRuriEventInfo")],
            ['black market excluded',js.includes("blackMarketMaterialPool.__ppaNoRuriEvent")]
          );
          console.log(checks);
          if(checks.some(x=>!x[1]))process.exit(1);
          NODE
