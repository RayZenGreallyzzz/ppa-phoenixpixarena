name: Inspect clan storage message routing (no deployment)
on:
  pull_request:
    paths:
      - 'tools/diag-clan-storage-20261017.mjs'
      - '.github/workflows/diag-clan-storage-20261017.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Inspect source and generated app (read-only)
        run: node tools/diag-clan-storage-20261017.mjs
