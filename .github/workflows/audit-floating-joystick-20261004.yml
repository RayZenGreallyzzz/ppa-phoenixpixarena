name: Audit floating joystick
on:
  push:
    branches: [main]
    paths:
      - tools/audit-floating-joystick-20261004.mjs
      - .github/workflows/audit-floating-joystick-20261004.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract joystick source
        run: node tools/audit-floating-joystick-20261004.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: floating-joystick-audit
          path: floating-joystick-audit.txt
          retention-days: 1
