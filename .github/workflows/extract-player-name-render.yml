name: Extract player name renderer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: contains(github.event.head_commit.message, 'Run player name renderer diagnostic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/extract-player-name-render.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-player-name-render.txt
          git commit -m "Add player name renderer diagnostic"
          git push
