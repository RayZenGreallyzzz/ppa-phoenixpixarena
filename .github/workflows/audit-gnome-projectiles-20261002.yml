name: Audit gnome projectiles 20261002
on:
  push:
    branches:
      - audit-gnome-projectiles-20261002
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/audit-gnome-projectiles-20261002.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gnome-projectile-audit
          path: gnome-projectile-audit.txt
          if-no-files-found: error
