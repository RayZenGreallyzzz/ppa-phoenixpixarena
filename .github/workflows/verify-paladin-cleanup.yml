name: Verify paladin cleanup from main
on:
  push:
    branches: [diag-player-number-20260928]
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, 'Run paladin cleanup build verify')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
