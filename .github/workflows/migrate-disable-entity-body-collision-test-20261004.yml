name: Migrate disable entity body collision test
on:
  push:
    branches: [main]
    paths:
      - tools/migrate-disable-entity-body-collision-test-20261004.mjs
      - .github/workflows/migrate-disable-entity-body-collision-test-20261004.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Disable entity body collision for diagnostic build
        run: node tools/migrate-disable-entity-body-collision-test-20261004.mjs
      - name: Verify diagnostic build
        run: |
          grep -q "v643-no-entity-body-collision-test-20261004" build.mjs
          npm run build
          grep -q "PPA_ENTITY_BODY_COLLISION_DISABLED_TEST_20261004" public/index.html
          grep -q "return clanBossSlide(x,y,dx,dy,r);" public/index.html
          grep -q "return worldBossSlide(x,y,dx,dy,r);" public/index.html
          grep -q "PPA_MOB_BOSS_SHADOWS_OFF_20261004" public/index.html
          grep -q "PPA_PLAYER3D_ANIM_HOTLOOP_FIX_20261004" public/game/player-3d-unified-runtime.js
          ! grep -q "animRateCheckAt" public/game/player-3d-unified-runtime.js
      - name: Commit diagnostic build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PPA01.bin PPA02.bin PPA03.bin PPA04.bin PPA05.bin PPA06.bin PPA07.bin PPA08.bin PPA09.bin PPA10.bin PPA11.bin PPA12.bin build.mjs
          git commit -m "Disable entity body collision for performance test"
          git push
