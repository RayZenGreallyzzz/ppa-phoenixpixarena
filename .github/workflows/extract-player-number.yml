name: Extract player number debug
on:
  push:
    branches: [diag-player-number-20260928]
permissions:
  contents: write
jobs:
  extract:
    if: contains(github.event.head_commit.message, 'Run player number diagnostic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/extract-player-number.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-player-number.txt
          git commit -m "Add player number diagnostic"
          git push
