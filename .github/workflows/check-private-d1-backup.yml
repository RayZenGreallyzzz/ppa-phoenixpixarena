name: Audit D1 private backup safety (no live export)
on:
  push:
    branches: [ops/d1-private-backup-20261009]
    paths:
      - tools/d1-private-export-to-stdout.mjs
      - tools/test-d1-private-export-approval-offline.mjs
      - .github/workflows/ppa-d1-encrypted-export-after-approval.yml
      - .github/workflows/check-private-d1-backup.yml

permissions:
  contents: read

jobs:
  audit-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and fail-safe export check
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/d1-private-export-to-stdout.mjs
          node tools/test-d1-private-export-approval-offline.mjs
          set +e
          node tools/d1-private-export-to-stdout.mjs >/tmp/should-be-empty.sql 2>/tmp/backup-error.log
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          test ! -s /tmp/should-be-empty.sql
          grep -q 'D1 token absent/invalid' /tmp/backup-error.log
          echo "PPA_D1_BACKUP_OFFLINE_SAFE_OK empty_token_abort=1 output_bytes=0 remote_requests=0 exports=0"
