name: Migrate Player3D animation speed sync
on:
  push:
    branches: [main]
    paths:
      - tools/migrate-player3d-anim-speed-sync-20261004.mjs
      - .github/workflows/migrate-player3d-anim-speed-sync-20261004.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Apply Player3D animation-speed sync
        run: node tools/migrate-player3d-anim-speed-sync-20261004.mjs
      - name: Static syntax and invariant checks
        run: |
          node --check gateway/player-3d-unified-runtime.js
          node --check tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "v638-player3d-anim-speed-sync-20261004" build.mjs
          grep -q "PPA_PLAYER3D_ANIM_SPEED_SYNC_20261004" gateway/player-3d-unified-runtime.js
          grep -q "function playerAnimTimeScale(e,name)" gateway/player-3d-unified-runtime.js
          grep -q "e.animRateCheckAt=stamp+120" gateway/player-3d-unified-runtime.js
          grep -q "next.setEffectiveTimeScale(rate)" gateway/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER_ANIM_RATE_SYNC_20261004" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "function playerAttackAnimRate()" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "function playerRunAnimRate()" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "60/(a.fps\*playerAttackAnimRate())" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "player-3d-unified-runtime.js?v=20261004u18" tools/postbuild-player-3d-unified-20261002.mjs
          ! grep -q "lockMeleeAttackLowerBody" gateway/player-3d-unified-runtime.js
          ! grep -q "captureMeleeLowerBody" gateway/player-3d-unified-runtime.js
      - name: Production build
        run: npm run build
      - name: Audit final player render ownership
        run: node tools/audit-player-render-ownership-20261003.mjs
      - name: Verify final gameplay and Player3D output
        run: |
          grep -q "PPA_PLAYER_ANIM_RATE_SYNC_20261004" public/index.html
          grep -q "function playerAttackAnimRate()" public/index.html
          grep -q "function playerRunAnimRate()" public/index.html
          grep -q "60/(a.fps\*playerAttackAnimRate())" public/index.html
          grep -q "player-3d-unified-runtime.js?v=20261004u18" public/index.html
          grep -q "PPA_PLAYER3D_MELEE_CLIP_FILTER_20261003" public/game/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_ANIM_SPEED_SYNC_20261004" public/game/player-3d-unified-runtime.js
          grep -q "unified-v8-anim-speed-sync" public/game/player-3d-unified-runtime.js
          grep -q "e.animRateCheckAt=stamp+120" public/game/player-3d-unified-runtime.js
          grep -q "next.setEffectiveTimeScale(rate)" public/game/player-3d-unified-runtime.js
          ! grep -q "lockMeleeAttackLowerBody" public/game/player-3d-unified-runtime.js
          ! grep -q "captureMeleeLowerBody" public/game/player-3d-unified-runtime.js
      - name: Commit Player3D animation-speed sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway/player-3d-unified-runtime.js tools/postbuild-player-3d-unified-20261002.mjs build.mjs
          if git diff --cached --quiet; then
            echo "No Player3D animation-speed changes to commit"
            exit 0
          fi
          git commit -m "Sync Player3D attack and run animation speed"
          git push
