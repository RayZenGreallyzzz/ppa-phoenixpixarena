name: Verify signed PPA forge material projection
on:
  pull_request:
    paths:
      - 'src/native-npc-readonly.js'
      - 'tools/test-native-forge-material-view.mjs'
      - 'tools/audit-original-smith-contract.mjs'
      - 'src/shared-forge.js'
      - 'src/worker.js'
      - 'tools/test-shared-forge.mjs'
      - 'tools/generate-shared-forge-recipes.py'
      - 'src/shared-forge-recipes.generated.json'
      - '.github/workflows/test-native-forge-material-view.yml'
permissions:
  contents: read
jobs:
  forge-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Signed forge projection parity (offline, no D1)
        run: node tools/test-native-forge-material-view.mjs
      - name: Real original six-gear forge and D1 idempotency parity
        run: node --disable-warning=ExperimentalWarning tools/test-shared-forge.mjs
      - name: Check complete original smith catalog
        run: python3 tools/generate-shared-forge-recipes.py --print-json
      - name: Inspect original Telegram smith code (no game writes)
        run: node tools/audit-original-smith-contract.mjs
