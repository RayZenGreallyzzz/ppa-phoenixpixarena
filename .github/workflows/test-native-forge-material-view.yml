name: Verify signed PPA forge material projection
on:
  pull_request:
    paths:
      - 'src/native-npc-readonly.js'
      - 'tools/test-native-forge-material-view.mjs'
      - '.github/workflows/test-native-forge-material-view.yml'
permissions:
  contents: read
jobs:
  forge-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Signed forge projection parity (offline, no D1)
        run: node tools/test-native-forge-material-view.mjs
