name: Verify registration targeted apply

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, 'Run registration targeted apply verify')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
