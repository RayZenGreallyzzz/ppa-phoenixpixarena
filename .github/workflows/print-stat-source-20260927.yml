name: Verify PPA build
on:
  push:
    branches:
      - main
jobs:
  verify:
    if: contains(github.event.head_commit.message, 'Run PPA build verify')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
