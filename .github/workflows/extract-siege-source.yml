name: Native siege build check
on:
  push:
    branches:
      - diag-siege-source-20260925
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install
      - run: npm run build
      - run: node tools/extract-siege-context.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: siege-context
          path: siege-context.txt
