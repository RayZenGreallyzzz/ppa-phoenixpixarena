name: Build standalone melee lab artifact
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-standalone-melee-lab-20261003.yml
      - tools/melee-contact-lab-20261003.html
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build one-file standalone lab
        shell: python
        run: |
          import base64, pathlib
          root=pathlib.Path('.')
          src=(root/'tools/melee-contact-lab-20261003.html').read_text(encoding='utf-8')
          models={
            '/game/Assassin.glb?v=20261002u2':'Assassin.glb',
            '/game/Berserker_Final.glb?v=20261002u2':'Berserker_Final.glb',
            '/game/Paladin_Final.glb?v=20261002u2':'Paladin_Final.glb',
            '/game/Tank_Mobile_Shield_Hammer_Final.glb?v=20261002u2':'Tank_Mobile_Shield_Hammer_Final.glb',
          }
          out=src
          for needle,filename in models.items():
            data=base64.b64encode((root/filename).read_bytes()).decode('ascii')
            uri='data:model/gltf-binary;base64,'+data
            if needle not in out:
              raise SystemExit('missing model needle '+needle)
            out=out.replace(needle,uri)
          out=out.replace('PPA · безопасный стенд ближнего боя','PPA · автономный стенд ближнего боя')
          out=out.replace('Изолирован от P, realtime, урона, моб-AI и основного Player3D. Здесь меняются только визуальная дистанция подхода и точка контакта.','Полностью автономный тест. Не связан с игрой, P, realtime, уроном, mob-AI или Player3D. Подкрути дистанцию и контакт и пришли скрин с цифрами.')
          out=out.replace('<title>PPA Melee Contact Lab</title>','<title>PPA Melee Contact Lab · Standalone</title>')
          dst=root/'PPA_Melee_Contact_Lab_Standalone.html'
          dst.write_text(out,encoding='utf-8')
          print('built',dst,'bytes',dst.stat().st_size)
          for filename in models.values():
            assert filename not in out, filename+' path survived'
      - name: Verify standalone output
        run: |
          test -s PPA_Melee_Contact_Lab_Standalone.html
          grep -q "data:model/gltf-binary;base64" PPA_Melee_Contact_Lab_Standalone.html
          grep -q "автономный стенд ближнего боя" PPA_Melee_Contact_Lab_Standalone.html
      - uses: actions/upload-artifact@v4
        with:
          name: PPA_Melee_Contact_Lab_Standalone
          path: PPA_Melee_Contact_Lab_Standalone.html
          compression-level: 6
          retention-days: 7
