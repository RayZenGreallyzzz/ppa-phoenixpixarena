name: Migrate Player3D melee in-place attack
on:
  push:
    branches: [main]
    paths:
      - tools/migrate-player3d-melee-inplace-20261003.mjs
      - .github/workflows/migrate-player3d-melee-inplace-20261003.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Apply migration
        run: node tools/migrate-player3d-melee-inplace-20261003.mjs
      - name: Syntax and source invariants
        run: |
          node --check gateway/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_MELEE_INPLACE_ATTACK_20261003" gateway/player-3d-unified-runtime.js
          grep -q "MELEE_INPLACE_CLASSES=new Set(\['tank','barbarian','paladin','assassin'\])" gateway/player-3d-unified-runtime.js
          grep -q "lockMeleeAttackLowerBody(e);" gateway/player-3d-unified-runtime.js
          grep -q "unified-v6-melee-inplace" gateway/player-3d-unified-runtime.js
          grep -q "player-3d-unified-runtime.js?v=20261003u16" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "v634-player3d-melee-inplace-20261003" build.mjs
      - name: Production build
        run: npm run build
      - name: Ownership audit
        run: node tools/audit-player-render-ownership-20261003.mjs
      - name: Verify built runtime
        run: |
          grep -q "PPA_PLAYER3D_MELEE_INPLACE_ATTACK_20261003" public/game/player-3d-unified-runtime.js
          grep -q "lockMeleeAttackLowerBody(e);" public/game/player-3d-unified-runtime.js
          grep -q "unified-v6-melee-inplace" public/game/player-3d-unified-runtime.js
          grep -q "player-3d-unified-runtime.js?v=20261003u16" public/index.html
          grep -q "v634-player3d-melee-inplace-20261003" build.mjs
      - name: Commit canonical changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway/player-3d-unified-runtime.js tools/postbuild-player-3d-unified-20261002.mjs build.mjs
          git commit -m "Keep melee attack combos in place"
          git push
