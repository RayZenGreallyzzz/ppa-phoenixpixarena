name: Migrate realtime cache and Player3D stability
on:
  push:
    branches: [main]
    paths:
      - tools/migrate-realtime-identity-player3d-stability-20261003.mjs
      - .github/workflows/migrate-realtime-identity-player3d-stability-20261003.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Apply narrow stability migration
        run: node tools/migrate-realtime-identity-player3d-stability-20261003.mjs
      - name: Syntax checks
        run: |
          node --check gateway/realtime-client.js
          node --check gateway/realtime-identity-sync.js
          node --check gateway/player-3d-unified-runtime.js
          node --check tools/postbuild-player-3d-unified-20261002.mjs
      - name: Verify source invariants
        run: |
          grep -q "PPA_REALTIME_IDENTITY_INBAND_20261003" gateway/realtime-client.js
          grep -q "type:'identity-sync'" gateway/realtime-client.js
          ! grep -q "PPA_REALTIME_RECONNECT" gateway/realtime-identity-sync.js
          grep -q "m.type === 'identity-sync'" src/realtime-stable.js
          ! grep -q "localStateMissingSince" gateway/player-3d-unified-runtime.js
          grep -q "localClass()||normalizeClass(localAnchor.classKey)" gateway/player-3d-unified-runtime.js
          grep -q "player-3d-unified-runtime.js?v=20261003u14" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "v632-realtime-player3d-stability-20261003" build.mjs
      - name: Production build
        run: npm run build
      - name: Audit final player render ownership
        run: node tools/audit-player-render-ownership-20261003.mjs
      - name: Verify built output
        run: |
          grep -q "PPA_REALTIME_IDENTITY_INBAND_20261003" public/game/realtime-client.js
          ! grep -q "PPA_REALTIME_RECONNECT" public/game/realtime-identity-sync.js
          grep -q "PPA_PLAYER3D_STABLE_HUD_ANCHOR_20261003" public/game/player-3d-unified-runtime.js
          ! grep -q "localStateMissingSince" public/game/player-3d-unified-runtime.js
          grep -q "localClass()||normalizeClass(localAnchor.classKey)" public/game/player-3d-unified-runtime.js
          grep -q "player-3d-unified-runtime.js?v=20261003u14" public/index.html
      - name: Commit canonical source changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway/player-3d-unified-runtime.js tools/postbuild-player-3d-unified-20261002.mjs build.mjs
          git commit -m "Preserve local Player3D across realtime state gaps"
          git push
