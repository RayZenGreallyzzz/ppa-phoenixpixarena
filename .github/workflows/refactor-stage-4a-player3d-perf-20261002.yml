name: Refactor Stage 4A Player3D performance
on:
  push:
    branches:
      - stage-4a-player3d-scratch-reuse-20261002
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-4a-player3d-scratch-reuse-20261002
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply refactor once
        run: |
          if grep -q "const viewState={w:0,h:0};" gateway/player-3d-unified-runtime.js; then
            echo "Stage 4A runtime refactor already applied"
          else
            node tools/refactor-stage-4a-player3d-perf-20261002.mjs
          fi
      - run: node --check gateway/player-3d-unified-runtime.js
      - name: Verify intended runtime shape
        run: |
          grep -q "const viewState={w:0,h:0};" gateway/player-3d-unified-runtime.js
          grep -q "const mapState={ready:false" gateway/player-3d-unified-runtime.js
          grep -q "if(e.hiddenState===hidden)return;" gateway/player-3d-unified-runtime.js
          grep -q "prepareWorldMap();" gateway/player-3d-unified-runtime.js
          ! grep -q "new THREE.Vector2(px/view.w" gateway/player-3d-unified-runtime.js
      - name: Commit runtime refactor if changed
        run: |
          if git diff --quiet -- gateway/player-3d-unified-runtime.js; then
            echo "No runtime changes to commit"
            exit 0
          fi
          test -z "$(git diff --name-only | grep -v '^gateway/player-3d-unified-runtime.js$')"
          git config user.name "RayZenGreallyzzz"
          git config user.email "genry.undeniable@gmail.com"
          git add gateway/player-3d-unified-runtime.js
          git commit -m "Stage 4A: optimize Player3D per-frame allocations"
          git push origin HEAD:stage-4a-player3d-scratch-reuse-20261002
