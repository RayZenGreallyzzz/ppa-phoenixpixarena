name: Migrate Player3D runtime ownership
on:
  push:
    branches:
      - main
    paths:
      - tools/migrate-player3d-runtime-ownership-20261003.mjs
      - .github/workflows/migrate-player3d-runtime-ownership-20261003.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate migration source
        run: node --check tools/migrate-player3d-runtime-ownership-20261003.mjs
      - name: Apply strict source migration
        run: node tools/migrate-player3d-runtime-ownership-20261003.mjs
      - name: Validate migrated JavaScript
        run: |
          node --check gateway/player-3d-unified-runtime.js
          node --check tools/postbuild-player-3d-unified-20261002.mjs
          node --check tools/audit-player-render-ownership-20261003.mjs
      - name: Install build dependencies
        run: npm install
      - name: Build migrated production output
        run: npm run build
      - name: Audit final player ownership
        run: node tools/audit-player-render-ownership-20261003.mjs
      - name: Verify migrated architecture
        run: |
          grep -q "PPA_PLAYER3D_RUNTIME_OWNS_LOCAL_STATE_20261003" gateway/player-3d-unified-runtime.js
          grep -q "syncLocalFromGame(now);" gateway/player-3d-unified-runtime.js
          grep -q "threeInitPromise" gateway/player-3d-unified-runtime.js
          grep -q "retryAt:0,retryCount:0" gateway/player-3d-unified-runtime.js
          ! grep -q "e.kind==='local'?500:1800" gateway/player-3d-unified-runtime.js
          ! grep -q "__PPA3D_LOCAL_PENDING" gateway/player-3d-unified-runtime.js
          ! grep -q "__PPA3D_LOCAL_PENDING" public/index.html
          grep -q "player-3d-unified-runtime.js?v=20261003u9" public/index.html
          test ! -e tools/postbuild-player-3d-local-lifecycle-20261003.mjs
          git diff --check
      - name: Commit canonical source migration
        run: |
          git config user.name "RayZenGreallyzzz"
          git config user.email "genry.undeniable@gmail.com"
          git add gateway/player-3d-unified-runtime.js tools/postbuild-player-3d-unified-20261002.mjs tools/audit-player-render-ownership-20261003.mjs package.json tools/postbuild-player-3d-local-lifecycle-20261003.mjs
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 1
          fi
          git commit -m "Make Player3D runtime own local lifecycle"
          git push origin HEAD:main
