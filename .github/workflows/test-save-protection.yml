name: Test save protection
on:
  pull_request:
  push:
    branches:
      - main
      - fix-save-conflict-latch-20261002
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --check gateway/ppa-bridge.js
      - run: node tools/test-save-conflict-latch.mjs gateway/ppa-bridge.js
      - run: npm run build
      - run: node tools/test-save-conflict-latch.mjs public/game/ppa-bridge.js
