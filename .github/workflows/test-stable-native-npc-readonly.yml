name: Stable PPA native NPC owner-only read cutover
on:
  pull_request:
    paths:
      - 'src/worker.js'
      - 'src/native-npc-readonly.js'
      - 'src/native-merchant-readonly.js'
      - 'src/shared-merchant.js'
      - 'src/native-action-ledger.js'
      - 'src/shared-forge.js'
      - 'src/shared-sharpen.js'
      - 'src/shared-forge-recipes.generated.json'
      - 'src/shared-inventory.js'
      - 'src/shared-storage.js'
      - 'tools/test-shared-forge.mjs'
      - 'tools/test-shared-sharpen.mjs'
      - 'tools/test-shared-inventory.mjs'
      - 'tools/test-shared-storage.mjs'
      - 'tools/test-stable-merchant-purchases.mjs'
      - 'tools/test-stable-native-merchant-readonly.mjs'
      - 'tools/test-stable-native-npc-readonly.mjs'
      - '.github/workflows/test-stable-native-npc-readonly.yml'
permissions:
  contents: read
jobs:
  npc-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: node --check src/worker.js
      - name: Verify signed-owner-only NPC projection, without mutations
        run: node tools/test-stable-native-npc-readonly.mjs
      - name: Verify exact PPA merchant stock with no-spend contract
        run: node tools/test-stable-native-merchant-readonly.mjs
      - name: Differential original Telegram purchases, signed native route, replay and CAS
        run: node tools/test-stable-merchant-purchases.mjs
      - name: Original PPA forge recipes, 8 classes and signed route
        run: node tools/test-shared-forge.mjs
      - name: Original PPA sharpen +1 to +7, server random and replay
        run: node tools/test-shared-sharpen.mjs
      - name: Original equipment UID and class-bound inventory moves
        run: node tools/test-shared-inventory.mjs
      - name: Original warehouse bag capacities and +7 preservation
        run: node tools/test-shared-storage.mjs
