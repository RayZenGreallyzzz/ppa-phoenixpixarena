name: Audit Stage 3 Player3D scenes
on:
  push:
    branches:
      - stage-3-player3d-scene-audit-20261002
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: node tools/audit-stage-3-player3d-scenes-20261002.mjs
