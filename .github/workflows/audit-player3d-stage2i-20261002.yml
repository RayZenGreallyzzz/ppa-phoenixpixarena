name: Audit Player3D Stage 2I
on:
  push:
    branches:
      - player3d-stage2i-20261002
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: node tools/audit-player3d-stage2i-20261002.mjs
