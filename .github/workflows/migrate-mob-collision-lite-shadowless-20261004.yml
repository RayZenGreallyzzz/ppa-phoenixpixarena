name: Migrate mob collision lite and shadowless
on:
  push:
    branches: [main]
    paths:
      - tools/migrate-mob-collision-lite-shadowless-20261004.mjs
      - .github/workflows/migrate-mob-collision-lite-shadowless-20261004.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Apply collision-lite and shadowless migration
        run: node tools/migrate-mob-collision-lite-shadowless-20261004.mjs
      - name: Verify source and production build
        run: |
          grep -q "v641-mob-collision-lite-shadowless-20261004" build.mjs
          npm run build
          grep -q "PPA_MOB_COLLISION_LITE_20261004" public/index.html
          grep -q "PPA_MOB_BOSS_SHADOWS_OFF_20261004" public/index.html
          grep -q "function ppaMoveWithWorldBodyCollision(x,y,dx,dy,r)" public/index.html
          grep -q "function clanBossMoveWithBodyCollision(x,y,dx,dy,r)" public/index.html
          grep -q "function worldBossMoveWithCrystalCollision(x,y,dx,dy,r)" public/index.html
          grep -q "PPA_FARTZONE_AXIS_SLIDE_20261004" public/index.html
          grep -q "PPA_PLAYER3D_ANIM_HOTLOOP_FIX_20261004" public/game/player-3d-unified-runtime.js
          ! grep -q "animRateCheckAt" public/game/player-3d-unified-runtime.js
      - name: Commit canonical optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PPA01.bin PPA02.bin PPA03.bin PPA04.bin PPA05.bin PPA06.bin PPA07.bin PPA08.bin PPA09.bin PPA10.bin PPA11.bin PPA12.bin build.mjs
          git commit -m "Optimize mob collision and remove entity shadows"
          git push
