name: Apply clan siege cleanup
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-clan-siege-cleanup.yml'
      - 'tools/apply-clan-siege-cleanup.mjs'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply source cleanup
        run: node tools/apply-clan-siege-cleanup.mjs
      - name: Install dependencies
        run: npm install
      - name: Verify build
        run: npm run build
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/apply-clan-siege-cleanup.mjs .github/workflows/apply-clan-siege-cleanup.yml
          git add build.mjs gateway/clan-siege-fixes.js
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "Clean clan siege runtime HUD hacks"
          git push
