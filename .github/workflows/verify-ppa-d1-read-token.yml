name: Verify PPA D1 read-only access
on:
  push:
    branches:
      - feature/godot-readonly-state-20261009
    paths:
      - .github/workflows/verify-ppa-d1-read-token.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Cloudflare D1 metadata without reading or exporting player saves
        env:
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_D1_READ_TOKEN || '';
          if (!token) {
            console.error('PPA_D1_READ_SECRET_MISSING: verify exact GitHub secret name');
            process.exit(1);
          }
          const accountId = 'f091a5713d0a349e6e15f390cacfb029';
          // Cloudflare API token formats vary. Validate the actual credential via
          // Cloudflare instead of assuming a token prefix; never print its bytes.
          if (token !== token.trim()) {
            console.error('PPA_D1_TOKEN_WHITESPACE: remove leading/trailing spaces from the GitHub secret');
            process.exit(1);
          }
          const verification = await fetch('https://api.cloudflare.com/client/v4/accounts/'+accountId+'/tokens/verify', {
            method:'GET', headers:{Authorization:'Bearer '+token}, signal: AbortSignal.timeout(15000),
          });
          if (!verification.ok) {
            console.error('PPA_D1_TOKEN_VERIFY_FAILED http_status='+verification.status);
            process.exit(1);
          }
          const verified = await verification.json();
          if (!verified?.success || verified.result?.status !== 'active') {
            console.error('PPA_D1_TOKEN_NOT_ACTIVE');
            process.exit(1);
          }
          console.log('PPA_D1_ACCOUNT_TOKEN_ACTIVE_OK');
          const databaseId = '53d15b19-362d-4850-a6b8-df058ac1fba7';
          const url = 'https://api.cloudflare.com/client/v4/accounts/'+accountId+'/d1/database/'+databaseId;
          let response;
          try {
            response = await fetch(url, {
              method: 'GET',
              headers: { Authorization: 'Bearer '+token },
              signal: AbortSignal.timeout(15000),
            });
          } catch (err) {
            console.error('PPA_D1_METADATA_CONNECTION_FAILED');
            process.exit(1);
          }
          if (!response.ok) {
            console.error('PPA_D1_METADATA_AUTH_FAILED http_status='+response.status);
            process.exit(1);
          }
          let payload;
          try { payload=await response.json(); } catch { payload=null; }
          if (!payload?.success || payload.result?.name !== 'ppa-phoenix-db' ||
              payload.result?.uuid !== databaseId) {
            console.error('PPA_D1_METADATA_MISMATCH');
            process.exit(1);
          }
          // Never print SQL, row values, token, API response, or player identifiers.
          console.log('PPA_D1_READ_ACCESS_OK remote_get_metadata=1 sql_queries=0 exports=0 writes=0 deploys=0');
          NODE
