name: Test Player3D performance invariants
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --check gateway/player-3d-unified-runtime.js
      - name: Verify Stage 4A, 4B, idle-yaw and muzzle source invariants
        run: |
          grep -q "const viewState={w:0,h:0};" gateway/player-3d-unified-runtime.js
          grep -q "const mapState={ready:false" gateway/player-3d-unified-runtime.js
          grep -q "scratchRay=new THREE.Raycaster();" gateway/player-3d-unified-runtime.js
          grep -q "scratchPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);" gateway/player-3d-unified-runtime.js
          grep -q "groundResult.z=z;return groundResult;" gateway/player-3d-unified-runtime.js
          grep -q "if(e.hiddenState===hidden)return;" gateway/player-3d-unified-runtime.js
          grep -q "prepareWorldMap();" gateway/player-3d-unified-runtime.js
          grep -q "projectIntoHud(e.root.position,view,h,'feetX','feetY');" gateway/player-3d-unified-runtime.js
          grep -q "const wallNow=Date.now();" gateway/player-3d-unified-runtime.js
          grep -q "applyHidden(e,wallNow);" gateway/player-3d-unified-runtime.js
          grep -q "drawHud(e,wallNow);" gateway/player-3d-unified-runtime.js
          grep -q "if(e.head)e.head.getWorldPosition(scratchHead);" gateway/player-3d-unified-runtime.js
          grep -q "if(e.hasMotionYaw&&!attack)return e.lastMotionYaw;" gateway/player-3d-unified-runtime.js
          grep -q "if(e.hasMotionYaw&&!remoteAttack)return e.lastMotionYaw;" gateway/player-3d-unified-runtime.js
          grep -q "return now<e.movingUntil?'run':'idle';" gateway/player-3d-unified-runtime.js
          grep -q "if(e.root)e.root.updateWorldMatrix(true,true);" gateway/player-3d-unified-runtime.js
          ! grep -q "new THREE.Vector2(px/view.w" gateway/player-3d-unified-runtime.js
          ! grep -q "ray.ray.intersectPlane(new THREE.Plane" gateway/player-3d-unified-runtime.js
          ! grep -q "const p=new THREE.Vector3();e.head.getWorldPosition(p)" gateway/player-3d-unified-runtime.js
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('gateway/player-3d-unified-runtime.js','utf8');
          const a=src.indexOf('function frame(now){');
          const b=src.indexOf('window.PPA_PLAYER3D={',a);
          if(a<0||b<0)throw new Error('Player3D frame range missing');
          const frame=src.slice(a,b);
          if(frame.includes('updateWorldMatrix(true,true)'))throw new Error('full-tree update leaked into Player3D frame loop');
          const n=(src.match(/if\(e\.root\)e\.root\.updateWorldMatrix\(true,true\);/g)||[]).length;
          if(n!==1)throw new Error('expected exactly one on-demand muzzle matrix update, found '+n);
          console.log('verified: full-tree matrix update is muzzle-only, never per-frame');
          NODE
      - name: Guard gameplay and mob boss source systems
        run: |
          test -e gateway/remote-player-3d-dispatch.js
          test -e gateway/dungeon-mob-events.js
          test -e gateway/dungeon60-dragon.js
          test -e gateway/boss-drop-boost.js
          test -e gateway/clan-boss-loot.js
      - run: npm run build
      - name: Verify optimized runtime survives final build
        run: |
          grep -q "const viewState={w:0,h:0};" public/game/player-3d-unified-runtime.js
          grep -q "const mapState={ready:false" public/game/player-3d-unified-runtime.js
          grep -q "if(e.hiddenState===hidden)return;" public/game/player-3d-unified-runtime.js
          grep -q "prepareWorldMap();" public/game/player-3d-unified-runtime.js
          grep -q "const wallNow=Date.now();" public/game/player-3d-unified-runtime.js
          grep -q "applyHidden(e,wallNow);" public/game/player-3d-unified-runtime.js
          grep -q "drawHud(e,wallNow);" public/game/player-3d-unified-runtime.js
          grep -q "if(e.hasMotionYaw&&!attack)return e.lastMotionYaw;" public/game/player-3d-unified-runtime.js
          grep -q "if(e.hasMotionYaw&&!remoteAttack)return e.lastMotionYaw;" public/game/player-3d-unified-runtime.js
          grep -q "if(e.root)e.root.updateWorldMatrix(true,true);" public/game/player-3d-unified-runtime.js
          ! grep -q "new THREE.Vector2(px/view.w" public/game/player-3d-unified-runtime.js
          grep -q "worldX:Number(P.x),worldY:Number(P.y)" public/index.html
          grep -q "worldX:Number(r.x),worldY:Number(r.y)" public/game/remote-player-3d-dispatch.js
          test -e public/game/dungeon-mob-events.js
          test -e public/game/dungeon60-dragon.js
          test -e public/game/boss-drop-boost.js
          test -e public/game/clan-boss-loot.js
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('public/game/player-3d-unified-runtime.js','utf8');
          const a=src.indexOf('function frame(now){');
          const b=src.indexOf('window.PPA_PLAYER3D={',a);
          if(a<0||b<0)throw new Error('built Player3D frame range missing');
          if(src.slice(a,b).includes('updateWorldMatrix(true,true)'))throw new Error('built runtime has full-tree update in frame loop');
          NODE
