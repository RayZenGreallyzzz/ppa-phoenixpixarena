name: Inspect perf source
on:
  push:
    branches: [main]
jobs:
  inspect:
    if: contains(github.event.head_commit.message, 'Run perf source inspect')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/inspect-perf-source-20260928.mjs
