name: Inspect Events Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-events.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract native Events script
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const parts=Array.from({length:12},(_,i)=>`PPA${String(i+1).padStart(2,'0')}.bin`);
          const source=zlib.gunzipSync(Buffer.concat(parts.map(p=>fs.readFileSync(p)))).toString('utf8');
          const anchor=source.indexOf('id="eventsMenuFrame"');
          const s=source.indexOf('const events=[{',anchor);
          if(anchor<0||s<0) throw new Error('native events anchors missing');
          let e=source.indexOf('&lt;/script&gt;',s);
          if(e<0)e=Math.min(source.length,s+2000000);
          let chunk=source.slice(s,e);
          chunk=chunk.replace(/data:image\/[A-Za-z0-9.+-]+;base64,[A-Za-z0-9+/=]+/g,'data:image/REMOVED;base64,REMOVED');
          chunk=chunk.replace(/&quot;/g,'"').replace(/&#x27;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
          fs.writeFileSync('event-script.txt',chunk);
          console.log('EVENT_SCRIPT_START');
          console.log(chunk);
          console.log('EVENT_SCRIPT_END');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: event-script
          path: event-script.txt
