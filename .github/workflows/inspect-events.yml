name: Inspect Events Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-events.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect native events iframe
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const parts=Array.from({length:12},(_,i)=>`PPA${String(i+1).padStart(2,'0')}.bin`);
          const source=zlib.gunzipSync(Buffer.concat(parts.map(p=>fs.readFileSync(p)))).toString('utf8');
          const anchor=source.indexOf('id="eventsMenuFrame"');
          if(anchor<0) throw new Error('eventsMenuFrame not found');
          const a=Math.max(0,anchor-12000), b=Math.min(source.length,anchor+900000);
          const chunk=source.slice(a,b);
          const terms=['postMessage','worldboss','clanSiege','citadel','eventsMenu','eventsClose','eventsSideTab','openEvents','go.onclick','shardShop'];
          const out=['ANCHOR='+anchor];
          for(const term of terms){
            let p=0,n=0;
            while((p=chunk.indexOf(term,p))>=0&&n<30){
              out.push('\n===== '+term+' local '+p+' abs '+(a+p)+' =====\n'+chunk.slice(Math.max(0,p-1800),Math.min(chunk.length,p+4200)));
              p+=term.length;n++;
            }
          }
          fs.writeFileSync('event-targets.txt',out.join('\n'));
          console.log('EVENT_TARGETS_START');
          console.log(out.join('\n'));
          console.log('EVENT_TARGETS_END');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: event-targets
          path: event-targets.txt
