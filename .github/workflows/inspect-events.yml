name: Verify Native Events Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-events.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Verify generated Events
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='public/index.html';
          const s=fs.readFileSync(p,'utf8');
          const checks=[
            ['native center',s.includes('ЦЕНТР СОБЫТИЙ')],
            ['ruri event',s.includes('Великий Рури')],
            ['game tab',s.includes('data-cat=&quot;game&quot;')],
            ['war tab',s.includes('data-cat=&quot;war&quot;')],
            ['old all-events removed',!s.includes('data-cat=&quot;all&quot;')],
            ['old overlay runtime removed',!s.includes('ruri-event-ui.js')]
          ];
          console.log(checks);
          if(checks.some(x=>!x[1]))process.exit(1);
          NODE
