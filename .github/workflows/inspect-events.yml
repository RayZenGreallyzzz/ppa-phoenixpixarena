name: Inspect Events Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-events.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect packed event source
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const zlib=require('zlib');
          const parts=Array.from({length:12},(_,i)=>`PPA${String(i+1).padStart(2,'0')}.bin`);
          const packed=Buffer.concat(parts.map(p=>fs.readFileSync(p)));
          const source=zlib.gunzipSync(packed).toString('utf8');
          const terms=['СОБЫТИЯ','События','Все события','Кристальный Титан','Цитадель Феникса','Мировой босс','Клановое событие'];
          const out=[];
          for(const term of terms){
            let pos=0,n=0;
            while((pos=source.indexOf(term,pos))>=0&&n<12){
              const a=Math.max(0,pos-5000),b=Math.min(source.length,pos+9000);
              out.push('\n===== '+term+' @ '+pos+' =====\n'+source.slice(a,b));
              pos+=term.length;n++;
            }
          }
          fs.writeFileSync('event-context.txt',out.join('\n'));
          console.log('SOURCE_LENGTH='+source.length);
          console.log('EVENT_CONTEXT_START');
          console.log(out.join('\n'));
          console.log('EVENT_CONTEXT_END');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: event-context
          path: event-context.txt
