name: Rune Source Debug

on:
  push:
    branches: [debug-rune-source]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect grimoire upgrade UI and pickup
        shell: python
        run: |
          import gzip, pathlib, re
          src=gzip.decompress(b"".join(pathlib.Path(f"PPA{i:02d}.bin").read_bytes() for i in range(1,13))).decode('utf-8')

          terms=[
            "function skillRank(id)",
            "function skillRule(rank)",
            "function tryGrimoireUpgrade(skillId)",
            "INV.grimoires[l.skillId]",
            "function sendInvState",
            "type:'upgradeSkill'",
            'type:"upgradeSkill"',
            "upgradeSkill",
            "skillData=sk?",
            "kind:'grimoire',skillId:id",
            "romanRank(",
            "уже III ранга"
          ]
          for term in terms:
              print("\n===== TERM "+term+" =====")
              pos=0; n=0
              while True:
                  i=src.find(term,pos)
                  if i<0 or n>=20: break
                  print("\n--- "+str(i)+" ---\n"+src[max(0,i-5000):min(len(src),i+12000)])
                  pos=i+len(term); n+=1
