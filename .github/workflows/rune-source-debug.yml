name: Rune Source Debug

on:
  push:
    branches: [debug-rune-source]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact rune inventory code
        shell: python
        run: |
          import gzip, pathlib, re
          src=gzip.decompress(b"".join(pathlib.Path(f"PPA{i:02d}.bin").read_bytes() for i in range(1,13))).decode("utf-8")
          needles=["runeInventory","renderRunes","runeSlotsGrid","charState","charRequestState","runes:","runeSlots","runeBag","ownedRunes"]
          for needle in needles:
              print("\n===== "+needle+" =====")
              start=0
              for n in range(12):
                  i=src.find(needle,start)
                  if i<0: break
                  a=max(0,i-1800); b=min(len(src),i+4200)
                  print(f"\n--- {n+1} @ {i} ---\n"+src[a:b])
                  start=i+len(needle)
