name: Rune Source Debug

on:
  push:
    branches: [debug-rune-source]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect grimoireRankDrops
        shell: python
        run: |
          import gzip, pathlib
          src=gzip.decompress(b"".join(pathlib.Path(f"PPA{i:02d}.bin").read_bytes() for i in range(1,13))).decode('utf-8')
          term='grimoireRankDrops'
          pos=0;n=0
          while True:
              i=src.find(term,pos)
              if i<0 or n>=50: break
              print("\n--- "+str(i)+" ---\n"+src[max(0,i-1800):min(len(src),i+4200)])
              pos=i+len(term);n+=1
