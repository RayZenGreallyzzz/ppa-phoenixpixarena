name: Rune Source Debug

on:
  push:
    branches: [debug-rune-source]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect V189 skill engine
        shell: python
        run: |
          import gzip, pathlib, re
          src=gzip.decompress(b"".join(pathlib.Path(f"PPA{i:02d}.bin").read_bytes() for i in range(1,13))).decode('utf-8')
          for term in ['V189_RANK','const ACTIVE_META','window.V189_ACTIVE_META','function v189','V189_ACTIVE_META','skillRank(sk.id)']:
              print("\n===== "+term+" =====")
              pos=0;n=0
              while True:
                  i=src.find(term,pos)
                  if i<0 or n>=20: break
                  print("\n--- "+str(i)+" ---\n"+src[max(0,i-2500):min(len(src),i+16000)])
                  pos=i+len(term);n+=1
