name: Rune Source Debug

on:
  push:
    branches: [debug-rune-source]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect book drop functions
        shell: python
        run: |
          import gzip, pathlib, re
          src=gzip.decompress(b"".join(pathlib.Path(f"PPA{i:02d}.bin").read_bytes() for i in range(1,13))).decode('utf-8')

          def block(name):
              m=re.search(r"function\s+"+re.escape(name)+r"\s*\([^)]*\)\s*\{",src)
              if not m:
                  print("\n===== "+name+" NOT FOUND ====="); return
              i=m.start(); depth=0; quote=None; esc=False
              for j in range(m.end()-1,min(len(src),i+25000)):
                  ch=src[j]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                      continue
                  if ch in ("'",'"',chr(96)):
                      quote=ch; continue
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:
                          print("\n===== "+name+" =====\n"+src[i:j+1]); return

          for n in [
              'v232RollTypedBook','v232PushTypedBook','v232PushBook',
              'v232ActiveBookChance','v232PassiveBookChance',
              'v232BookRankForLevel','v271PushDungeon41Book',
              'v271Drop4160','pushGrimoireDrop'
          ]:
              block(n)
