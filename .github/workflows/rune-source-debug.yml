name: Rune Source Debug

on:
  push:
    branches: [debug-rune-source]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect skill combat scaling
        shell: python
        run: |
          import gzip, pathlib, re
          src=gzip.decompress(b"".join(pathlib.Path(f"PPA{i:02d}.bin").read_bytes() for i in range(1,13))).decode('utf-8')

          names=sorted(set(re.findall(r"function\s+([A-Za-z0-9_]*(?:Skill|Passive)[A-Za-z0-9_]*)\s*\(",src)))
          print("===== FUNCTION NAMES =====")
          for n in names:
              if re.search(r"(cast|skill|passive)",n,re.I):
                  print(n)

          print("\n===== RANK ARRAYS AROUND SKILL FUNCTIONS =====")
          pats=[
            r"\[[^\]\n]{1,100}\]\[rank\]",
            r"rank\s*\*\s*[0-9.]+",
            r"[0-9.]+\s*\*\s*rank"
          ]
          seen=set()
          for pat in pats:
              for m in re.finditer(pat,src):
                  a=max(0,m.start()-350);b=min(len(src),m.start()+650)
                  chunk=src[a:b]
                  if re.search(r"(skill|passive|cast|heal|shield|stun|slow|dodge|crit|damage|atk|def|speed|cooldown|cd)",chunk,re.I):
                      key=m.start()
                      if key in seen: continue
                      seen.add(key)
                      print("\n--- "+str(m.start())+" ---\n"+chunk)
