name: Rune Source Debug
on:
  push:
    branches: [debug-rune-source]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect V189 rv usage
        shell: python
        run: |
          import gzip,pathlib,re
          src=gzip.decompress(b"".join(pathlib.Path(f"PPA{i:02d}.bin").read_bytes() for i in range(1,13))).decode('utf-8')
          a=src.find('/* === V189 ALL CLASS SKILLS + MANA + PASSIVES')
          b=src.find('</script>',a)
          seg=src[a:b]
          for i,line in enumerate(seg.splitlines(),1):
              if 'rv(' in line or 'skillRank(' in line or 'passiveBonusForCatalog' in line or 'useLearnedHudSkill' in line:
                  print(f"{i}: {line}")
