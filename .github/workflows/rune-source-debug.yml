name: Rune Source Debug

on:
  push:
    branches: [debug-rune-source]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect precise drop helpers
        shell: python
        run: |
          import gzip, pathlib, re
          src=gzip.decompress(b"".join(pathlib.Path(f"PPA{i:02d}.bin").read_bytes() for i in range(1,13))).decode('utf-8')
          def block(name):
              m=re.search(r"function\s+"+re.escape(name)+r"\s*\([^)]*\)\s*\{",src)
              if not m: print('\n===== '+name+' NOT FOUND ====='); return
              i=m.start(); depth=0; quote=None; esc=False
              for j in range(m.end()-1,min(len(src),i+30000)):
                  ch=src[j]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                      continue
                  if ch in ("'",'"',chr(96)): quote=ch; continue
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:
                          print('\n===== '+name+' =====\n'+src[i:j+1]); return
              print('\n===== '+name+' TRUNC =====\n'+src[i:i+30000])
          for n in ['normalGearDropChances','v232Drop1to20','v232Drop2130','v232Drop3140','mobDropInfo']:
              block(n)
          print('\n===== ALL NORMAL GEAR CHANCE REFERENCES =====')
          for m in re.finditer('normalGearDropChances',src):
              print(src[max(0,m.start()-800):min(len(src),m.start()+1600)])
