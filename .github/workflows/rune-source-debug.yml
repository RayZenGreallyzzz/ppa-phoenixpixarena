name: Rune Source Debug

on:
  push:
    branches: [debug-rune-source]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect skill rank usage
        shell: python
        run: |
          import gzip, pathlib, re
          src=gzip.decompress(b"".join(pathlib.Path(f"PPA{i:02d}.bin").read_bytes() for i in range(1,13))).decode('utf-8')

          pats=[
            r"\[[^\]\n]{1,100}\]\[rank\]",
            r"rank\s*\*\s*[0-9.]+",
            r"[0-9.]+\s*\*\s*rank",
            r"rank\s*===?\s*3",
            r"rank\s*[<>]=?\s*3"
          ]
          seen=set()
          for pat in pats:
              print("\n===== "+pat+" =====")
              for m in re.finditer(pat,src):
                  key=(m.start(),m.group(0))
                  if key in seen: continue
                  seen.add(key)
                  print("\n--- "+str(m.start())+" ---\n"+src[max(0,m.start()-800):min(len(src),m.start()+1600)])
