name: Test melee smart approach
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify canonical packed source
        run: |
          node - <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const parts=Array.from({length:12},(_,i)=>`PPA${String(i+1).padStart(2,'0')}.bin`);
          const src=zlib.gunzipSync(Buffer.concat(parts.map(p=>fs.readFileSync(p)))).toString('utf8');
          const required=[
            'PPA_MELEE_SMART_APPROACH_20261003',
            'tank:72,barbarian:78,paladin:74,assassin:64',
            'return Number.isFinite(melee)?melee:playerBasicRange()*.90;',
            'return Math.max(35,base+edge);'
          ];
          for(const s of required)if(!src.includes(s))throw new Error('Missing melee approach invariant: '+s);
          if((src.match(/PPA_MELEE_SMART_APPROACH_20261003/g)||[]).length!==1)throw new Error('Melee approach marker duplicated');
          for(const s of [
            "tank:{\n    name:'Страж',type:'Ближний бой',attackMode:'melee',\n    hp:260,mp:20,atk:12,def_:34,spd:2.00,atkSpd:0.95,range:95",
            "barbarian:{\n    name:'Берсерк',type:'Ближний бой',attackMode:'melee',\n    hp:150,mp:30,atk:20,def_:12,spd:3.50,atkSpd:1.20,range:105",
            "paladin:{\n    name:'Паладин',type:'Ближний бой',attackMode:'melee',\n    hp:170,mp:100,atk:14,def_:18,spd:3.20,atkSpd:1.05,range:100",
            "assassin:{\n    name:'Ассасин',type:'Ближний бой',attackMode:'melee',\n    hp:100,mp:60,atk:15,def_:5,spd:4.50,atkSpd:1.55,range:95"
          ])if(!src.includes(s))throw new Error('Legal melee hit range drifted');
          NODE
          grep -q "stripDeadPlayerSpriteAssets" build.mjs
      - name: Verify Player3D melee hot loop is clean
        run: |
          grep -q "PPA_PLAYER3D_MELEE_INPLACE_ATTACK_20261003" gateway/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_MELEE_CLIP_FILTER_20261003" gateway/player-3d-unified-runtime.js
          grep -q "makeMeleeInPlaceAttackClip" gateway/player-3d-unified-runtime.js
          grep -q "unified-v9-anim-speed-hotloop-fix" gateway/player-3d-unified-runtime.js
          ! grep -q "lockMeleeAttackLowerBody" gateway/player-3d-unified-runtime.js
          ! grep -q "captureMeleeLowerBody" gateway/player-3d-unified-runtime.js
          ! grep -q "meleeLowerBody" gateway/player-3d-unified-runtime.js
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Verify built gameplay
        run: |
          grep -q "PPA_MELEE_SMART_APPROACH_20261003" public/index.html
          grep -q "tank:72,barbarian:78,paladin:74,assassin:64" public/index.html
          grep -Fq "return Number.isFinite(melee)?melee:playerBasicRange()*.90;" public/index.html
          grep -Fq "return Math.max(35,base+edge);" public/index.html
          grep -q "PPA_PLAYER3D_MELEE_INPLACE_ATTACK_20261003" public/game/player-3d-unified-runtime.js
          grep -q "PPA_PLAYER3D_MELEE_CLIP_FILTER_20261003" public/game/player-3d-unified-runtime.js
          grep -q "unified-v9-anim-speed-hotloop-fix" public/game/player-3d-unified-runtime.js
          ! grep -q "lockMeleeAttackLowerBody" public/game/player-3d-unified-runtime.js
          ! grep -q "captureMeleeLowerBody" public/game/player-3d-unified-runtime.js
          ! grep -q "meleeLowerBody" public/game/player-3d-unified-runtime.js
          grep -q "player-3d-unified-runtime.js?v=20261005perf1" public/index.html
