name: Extract clan siege collision source
on:
  push:
    branches:
      - main
jobs:
  extract:
    if: contains(github.event.head_commit.message, 'Run clan siege collision source extraction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/extract-clan-siege-collision-20260925.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-clan-siege-collision.txt
          git commit -m "Add clan siege collision diagnostics"
          git push
