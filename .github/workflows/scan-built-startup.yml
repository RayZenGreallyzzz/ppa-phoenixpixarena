name: Scan built startup labels
on:
  push:
    branches: [diag-player-number-20260928]
permissions:
  contents: write
jobs:
  scan:
    if: contains(github.event.head_commit.message, 'Run built startup scan')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: node tools/scan-built-startup.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-built-startup.txt
          git commit -m "Add built startup scan"
          git push
