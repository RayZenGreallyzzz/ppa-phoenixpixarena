name: Patch PK reconnect sync temp
on:
  push:
    branches:
      - fix-pk-reconnect-sync-20261002
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply PK reconnect sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/patch-pk-reconnect-sync-temp.mjs
      - run: node --check gateway/realtime-client.js
      - name: Verify PK reconnect invariants
        run: |
          grep -F "sendRoom(true);sendMove(true);try{send({type:'player-pk-toggle',enabled:!!(window.PPA_PK_ACTIVE&&window.PPA_PK_ACTIVE())})}" gateway/realtime-client.js
          grep -F "if (m.type === 'player-pk-toggle')" src/realtime-stable.js
          grep -F "if (m.type === 'player-pk-hit' || m.type === 'player-pk-skill-hit')" src/realtime-stable.js
      - name: Commit runtime only
        run: |
          git config user.name "PPA CI"
          git config user.email "actions@users.noreply.github.com"
          git add gateway/realtime-client.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply PK reconnect sync"
          git push origin HEAD:fix-pk-reconnect-sync-20261002
