name: Diagnostic clan storage branch (no deploy)
on:
  push:
    branches:
      - fix/clan-storage-withdraw-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source (read-only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          const packed=Buffer.concat(Array.from({length:12},(_,i)=>fs.readFileSync('PPA'+String(i+1).padStart(2,'0')+'.bin')));
          const source=zlib.gunzipSync(packed).toString('utf8');
          console.log('UNPACKED_LENGTH',source.length);
          for(const key of ['function storageMove(mode,direction,idx,source)', 'function clanStorageSyncRuntime()', 'function storageItemForUi(', 'function clanStorageServerEvent(', 'window.PPA_SET_CLAN_STATE=', "d.type==='storageMove'", 'function sendClanState()', 'function normalizeStorage()', 'function clanSetOnlineState(', 'function clanStorageUnlocked()', 'function clanItemTransfer(']){
            const locs=[];let ix=0;
            while((ix=source.indexOf(key,ix))>=0){locs.push(ix);ix+=key.length;if(locs.length>=40)break}
            console.log('KEY',key,'COUNT',locs.length,'OFFSETS',locs.join(','));
            for(const at of locs.slice(0,2)){
              const before=650;
              const after=key==='function storageMove(mode,direction,idx,source)'?10000:(key==='window.PPA_SET_CLAN_STATE='?7500:4800);
              console.log('SNIPPET',key,JSON.stringify(source.slice(Math.max(0,at-before),at+after)));
            }
          }
          NODE
