name: Revert v643 and audit mob crowding
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/revert-v643-audit-mob-crowding-20261004.yml
permissions:
  contents: write
jobs:
  revert-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Revert failed no-entity-collision diagnostic build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit a4d4b226a32f875554a7786df7645dbeb88674ae
      - name: Verify v642 restored
        run: |
          grep -q "v642-mob-contact-tangent-glide-20261004" build.mjs
          grep -q "573cd5a78045c5ca5e9ef9a222baaedc559efc295eb0f376c9458e15e39cd167" build.mjs
      - name: Audit mob pursuit and crowding source
        run: |
          node - <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const parts=Array.from({length:12},(_,i)=>fs.readFileSync(`PPA${String(i+1).padStart(2,'0')}.bin`));
          const src=zlib.gunzipSync(Buffer.concat(parts)).toString('utf8');
          const out=[];
          function contexts(label,needle,radius=1800,limit=20){
            out.push(`\n===== ${label}: ${needle} =====`);
            let pos=0,n=0;
            while((pos=src.indexOf(needle,pos))>=0&&n<limit){
              const a=Math.max(0,pos-radius),b=Math.min(src.length,pos+needle.length+radius);
              out.push(`\n--- hit ${++n} @ ${pos} ---\n${src.slice(a,b)}`);
              pos+=needle.length;
            }
            out.push(`\nhits shown=${n}`);
          }
          contexts('world-body move refs','ppaMoveWithWorldBodyCollision(',2200,30);
          contexts('near-body refs','ppaNearWorldBodies(',1800,20);
          contexts('mob ready debug','MOB READY',3000,10);
          contexts('aggro refs','aggro',2200,30);
          contexts('target refs','target',1600,30);
          contexts('attack range refs','attackRange',1800,20);
          contexts('mob arrays','MOBS',2200,30);
          contexts('mob lower arrays','mobs',1800,30);
          fs.writeFileSync('mob-crowding-audit.txt',out.join('\n'),'utf8');
          console.log('audit chars',out.join('\n').length);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: mob-crowding-audit
          path: mob-crowding-audit.txt
          retention-days: 1
      - run: npm install
      - name: Production build after revert
        run: npm run build
      - name: Preserve performance invariants
        run: |
          grep -q "PPA_MOB_BOSS_SHADOWS_OFF_20261004" public/index.html
          grep -q "PPA_MOB_CONTACT_TANGENT_GLIDE_20261004" public/index.html
          grep -q "PPA_PLAYER3D_ANIM_HOTLOOP_FIX_20261004" public/game/player-3d-unified-runtime.js
          ! grep -q "animRateCheckAt" public/game/player-3d-unified-runtime.js
      - name: Push v643 revert
        run: git push
