name: Audit legacy player sprite symbols
on:
  push:
    branches:
      - player-anim-timing-audit-20261002
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: node tools/audit-legacy-player-sprites-20261002.mjs
