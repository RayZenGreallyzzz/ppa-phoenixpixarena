name: Fix Stage 5A2 early metadata guards
on:
  push:
    branches:
      - stage-5a2-ai-sprite-source-cleanup-20261002
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-5a2-ai-sprite-source-cleanup-20261002
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply fix once
        run: |
          if grep -Fq "class metadata declaration invalid" tools/player-source-cleanup-20261002.mjs; then
            echo "Stage 5A2 early guards already fixed"
          else
            node tools/fix-stage-5a2-early-metadata-guards.mjs
          fi
      - run: node --check tools/player-source-cleanup-20261002.mjs
      - run: node tools/test-player-source-cleanup-20261002.mjs
      - name: Commit helper if changed
        run: |
          if git diff --quiet -- tools/player-source-cleanup-20261002.mjs; then exit 0; fi
          git config user.name "RayZenGreallyzzz"
          git config user.email "genry.undeniable@gmail.com"
          git add tools/player-source-cleanup-20261002.mjs
          git commit -m "Fix Stage 5A2 early metadata guards"
          git push origin HEAD:stage-5a2-ai-sprite-source-cleanup-20261002
