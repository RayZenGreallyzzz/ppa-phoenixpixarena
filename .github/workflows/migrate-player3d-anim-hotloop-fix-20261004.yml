name: Migrate Player3D animation hot-loop fix
on:
  push:
    branches: [main]
    paths:
      - tools/migrate-player3d-anim-hotloop-fix-20261004.mjs
      - .github/workflows/migrate-player3d-anim-hotloop-fix-20261004.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Apply Player3D hot-loop fix
        run: node tools/migrate-player3d-anim-hotloop-fix-20261004.mjs
      - name: Static syntax and invariant checks
        run: |
          node --check gateway/player-3d-unified-runtime.js
          node --check tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "v639-player3d-anim-hotloop-fix-20261004" build.mjs
          grep -q "PPA_PLAYER3D_ANIM_HOTLOOP_FIX_20261004" gateway/player-3d-unified-runtime.js
          grep -q "unified-v9-anim-speed-hotloop-fix" gateway/player-3d-unified-runtime.js
          grep -q "next.setEffectiveTimeScale(rate)" gateway/player-3d-unified-runtime.js
          ! grep -q "animRateCheckAt" gateway/player-3d-unified-runtime.js
          ! grep -Fq "60/(a.fps*playerAttackAnimRate())" tools/postbuild-player-3d-unified-20261002.mjs
          grep -q "player-3d-unified-runtime.js?v=20261004u19" tools/postbuild-player-3d-unified-20261002.mjs
          ! grep -q "lockMeleeAttackLowerBody" gateway/player-3d-unified-runtime.js
          ! grep -q "captureMeleeLowerBody" gateway/player-3d-unified-runtime.js
      - name: Production build
        run: npm run build
      - name: Audit final player render ownership
        run: node tools/audit-player-render-ownership-20261003.mjs
      - name: Verify final gameplay and Player3D output
        run: |
          grep -q "PPA_PLAYER3D_ANIM_HOTLOOP_FIX_20261004" public/game/player-3d-unified-runtime.js
          grep -q "unified-v9-anim-speed-hotloop-fix" public/game/player-3d-unified-runtime.js
          grep -q "next.setEffectiveTimeScale(rate)" public/game/player-3d-unified-runtime.js
          ! grep -q "animRateCheckAt" public/game/player-3d-unified-runtime.js
          ! grep -q "lockMeleeAttackLowerBody" public/game/player-3d-unified-runtime.js
          ! grep -q "captureMeleeLowerBody" public/game/player-3d-unified-runtime.js
          grep -q "player-3d-unified-runtime.js?v=20261004u19" public/index.html
          grep -q "function playerAttackAnimRate()" public/index.html
          grep -q "function playerRunAnimRate()" public/index.html
          ! grep -Fq "60/(a.fps*playerAttackAnimRate())" public/index.html
      - name: Commit Player3D hot-loop fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway/player-3d-unified-runtime.js tools/postbuild-player-3d-unified-20261002.mjs build.mjs .github/workflows/test-player3d-performance.yml
          if git diff --cached --quiet; then
            echo "No hot-loop fix changes to commit"
            exit 0
          fi
          git commit -m "Remove Player3D animation speed hot-loop"
          git push
