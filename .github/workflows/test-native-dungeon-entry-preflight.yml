name: PPA Godot dungeon entry read-only admission QA
on:
  pull_request:
    paths:
      - 'src/native-dungeon-entry-preflight.js'
      - 'src/native-dungeon-shadow-actors.js'
      - 'tools/test-native-dungeon-shadow-actors.mjs'
      - 'tools/test-native-pve-shadow-intent.mjs'
      - 'src/native-pve-authority-state-lab.js'
      - 'tools/test-native-pve-authority-state-lab.mjs'
      - 'src/native-pve-atomic-kill-lab.js'
      - 'tools/test-native-pve-atomic-kill-lab.mjs'
      - 'src/native-pve-hit-geometry-lab.js'
      - 'tools/test-native-pve-hit-geometry-lab.mjs'
      - 'tools/audit-original-pve-damage-source.mjs'
      - 'src/native-pve-original-basic-damage-parity.js'
      - 'tools/test-native-pve-basic-damage-parity.mjs'
      - 'src/realtime-stable.js'
      - 'tools/test-native-dungeon-entry-preflight.mjs'
      - '.github/workflows/test-native-dungeon-entry-preflight.yml'
permissions:
  contents: read
jobs:
  dungeon-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed socket room eligibility stays observer only
        run: node tools/test-native-dungeon-entry-preflight.mjs
      - name: Verify owner-fenced, expiring observer-only actor shadow
        run: node tools/test-native-dungeon-shadow-actors.mjs
      - name: Fence native combat attempts by signed shadow and replay ID
        run: node tools/test-native-pve-shadow-intent.mjs
      - name: Audit isolated authoritative-vitals simulation and original skill references
        run: node tools/test-native-pve-authority-state-lab.mjs
      - name: Verify SQLite atomic kill claim and save CAS with rollback
        run: node tools/test-native-pve-atomic-kill-lab.mjs
      - name: Audit server-state target generation, range, moving mobs and synthetic LOS
        run: node tools/test-native-pve-hit-geometry-lab.mjs
      - name: Inspect checksum-locked original Telegram PvE damage call sites
        run: node tools/audit-original-pve-damage-source.mjs
      - name: Differential-test Telegram basic damage for all eight classes
        run: node tools/test-native-pve-basic-damage-parity.mjs
      - name: Preserve native combat intent and fake-damage rejections
        run: node tools/test-native-pve-combat-intent.mjs
      - name: Keep server PvE readiness fail-closed
        run: node tools/test-native-pve-readiness-guard.mjs
